<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAYERS - Goalink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Oswald:wght@300;500&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --main-cyan: #4bb8e0; --sumi-black: #0c0c0c; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--sumi-black); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; overflow-x: hidden; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        
        /* 共通パーツ */
        .site-logo { height: 3.5rem; width: auto; object-fit: contain; }
        .menu-trigger { width: 28px; height: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; cursor: pointer; z-index: 200; position: relative; }
        .menu-trigger span { display: block; height: 1px; background-color: #fff; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); }
        .menu-trigger span:nth-child(1) { width: 100%; }
        .menu-trigger span:nth-child(2) { width: 60%; }
        .active span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); width: 100%; }
        .active span:nth-child(2) { transform: translateY(-6.5px) rotate(-45deg); width: 100%; }

        #sideMenu {
            position: fixed; top: 0; right: -100%; width: 75%; height: 100%;
            background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(20px);
            z-index: 150; transition: right 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex; flex-direction: column; justify-content: center; padding-left: 12%;
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        #sideMenu.open { right: 0; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); opacity: 0; visibility: hidden; z-index: 100; transition: 0.6s; }
        #overlay.show { opacity: 1; visibility: visible; }
        .menu-item { opacity: 0; transform: translateX(20px); transition: 0.5s; margin-bottom: 2rem; }
        #sideMenu.open .menu-item { opacity: 1; transform: translateX(0); }

        #pagetop {
            position: fixed; right: 24px; bottom: 24px; width: 56px; height: 56px;
            background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 90; opacity: 0; visibility: hidden; transition: 0.4s; transform: translateY(10px);
            text-decoration: none;
        }
        #pagetop.show { opacity: 1; visibility: visible; transform: translateY(0); }
        #pagetop svg { width: 14px; height: 14px; fill: var(--main-cyan); margin-bottom: 2px; }
        #pagetop span { font-family: 'Oswald', sans-serif; font-size: 0.55rem; color: var(--main-cyan); letter-spacing: 0.1em; font-weight: 500; }

        /* コンテンツ見出し */
        .section-header { margin-bottom: 2.5rem; }
        .section-title-ja { font-family: 'Noto Serif JP', serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 0.05em; display: block; }
        .section-title-en { font-family: 'Oswald', sans-serif; font-size: 0.7rem; letter-spacing: 0.5em; color: var(--main-cyan); text-transform: uppercase; display: block; margin-bottom: 0.5rem; }

        /* カテゴリボタン */
        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 3rem; }
        .cat-btn { 
            border: 1px solid rgba(255,255,255,0.1); padding: 12px 4px; text-align: center; 
            font-family: 'Oswald', sans-serif; font-size: 0.6rem; letter-spacing: 0.1em; 
            transition: 0.3s; color: rgba(255,255,255,0.4); cursor: pointer; background: rgba(255,255,255,0.02); 
        }
        .cat-btn.active { border-color: var(--main-cyan); color: var(--main-cyan); background: rgba(75, 184, 224, 0.05); }

        /* ランキングカード */
        .ranking-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05); padding: 1.5rem; margin-bottom: 3rem; }
        .ranking-label { border-left: 3px solid var(--main-cyan); padding-left: 1rem; margin-bottom: 1.5rem; }
        .ranking-title { font-family: 'Noto Serif JP', serif; font-size: 1.25rem; font-weight: 900; display: block; letter-spacing: 0.05em; }

        .player-row { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05); min-height: 64px; }
        .player-row:last-child { border-bottom: none; }
        .rank-num { font-family: 'Oswald', sans-serif; font-size: 1.2rem; font-weight: 500; width: 35px; color: rgba(255,255,255,0.1); }
        .rank-1 { color: #FFD700; font-size: 1.5rem; font-weight: 700; opacity: 1; }
        .player-info { flex: 1; border-left: 2px solid rgba(255,255,255,0.05); padding-left: 12px; margin-left: 4px; }
        .player-name { font-family: 'Noto Serif JP', serif; font-size: 0.95rem; font-weight: 600; color: rgba(255,255,255,0.8); }
        .player-team { font-size: 0.65rem; color: #555; }
        .stat-value { font-family: 'Oswald', sans-serif; font-size: 1.2rem; color: var(--main-cyan); text-align: right; opacity: 0.8; }
        .stat-unit { font-size: 0.6rem; margin-left: 3px; opacity: 0.4; }

        .note-text { font-size: 0.6rem; color: #555; margin-top: 1rem; line-height: 1.6; }

        .fade-in { animation: fadeIn 1s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* スケルトン表示用 */
        .loading-shimmer { animation: shimmer 2s infinite linear; background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.03) 50%, rgba(255,255,255,0) 100%); background-size: 200% 100%; }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleMenu()"></div>

    <a href="#" id="pagetop" onclick="scrollToTop(event)">
        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
        <span>TOP</span>
    </a>

    <header class="h-28 px-8 flex justify-between items-center fixed top-0 w-full z-[200] bg-gradient-to-b from-black/95 to-transparent">
        <a href="index.html"><img src="goalinklogo.png" alt="Goalink" class="site-logo"></a>
        <div id="menuBtn" onclick="toggleMenu()" class="menu-trigger">
            <span></span>
            <span></span>
        </div>
    </header>

    <nav id="sideMenu">
        <div class="menu-item" style="transition-delay: 0.1s;"><a href="https://hekion.github.io/goalinkjp/schedule.html"><span class="font-serif text-2xl">試合日程</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">SCHEDULE</small></a></div>
        <div class="menu-item" style="transition-delay: 0.2s;"><a href="teams.html"><span class="font-serif text-2xl">チーム一覧</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">TEAMS</small></a></div>
        <div class="menu-item" style="transition-delay: 0.3s;"><a href="standing.html"><span class="font-serif text-2xl">順位表</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">STANDING</small></a></div>
        <div class="menu-item" style="transition-delay: 0.4s;"><a href="database.html"><span class="font-serif text-2xl text-[#4bb8e0]">個人成績</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">PLAYERS</small></a></div>
        <div class="menu-item" style="transition-delay: 0.5s;"><a href="https://note.com/goalink_jp" target="_blank"><span class="font-serif text-2xl">節スタッツまとめ</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">STATS SUMMARY</small></a></div>
        <div class="mt-8 border-t border-white/10 pt-8 menu-item" style="transition-delay: 0.6s;">
            <a href="https://x.com/Goalink_JP" target="_blank" class="flex items-center gap-3">
                <svg class="w-6 h-6 fill-white" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                <span class="font-serif text-xl text-gray-400">公式Xへ</span>
            </a>
        </div>
    </nav>

    <main class="pt-40 px-8 max-w-screen-md mx-auto min-h-screen">
        <div class="section-header fade-in">
            <span class="section-title-en">Player Stats</span>
            <span class="section-title-ja">個人成績</span>
        </div>

        <div class="category-grid fade-in" style="animation-delay: 0.2s;">
            <div class="cat-btn active" onclick="changeCategory('J1_EAST', this)">J1 EAST</div>
            <div class="cat-btn" onclick="changeCategory('J1_WEST', this)">J1 WEST</div>
            <div class="cat-btn" onclick="changeCategory('J2_J3_EA', this)">J2/J3 EAST-A</div>
            <div class="cat-btn" onclick="changeCategory('J2_J3_EB', this)">J2/J3 EAST-B</div>
            <div class="cat-btn" onclick="changeCategory('J2_J3_WA', this)">J2/J3 WEST-A</div>
            <div class="cat-btn" onclick="changeCategory('J2_J3_WB', this)">J2/J3 WEST-B</div>
        </div>

        <div id="ranking-container" class="fade-in" style="animation-delay: 0.3s;">
            <div class="ranking-card">
                <div class="ranking-label"><span class="ranking-title">得点王</span></div>
                <div id="list-goals" class="ranking-list"></div>
            </div>

            <div class="ranking-card">
                <div class="ranking-label"><span class="ranking-title">得点率</span></div>
                <div id="list-per90" class="ranking-list"></div>
                <p class="note-text">※90分あたりの得点率（得点÷出場時間×90）を表示。累計出場時間が90分以上の選手のみを対象としています。</p>
            </div>

            <div class="ranking-card">
                <div class="ranking-label"><span class="ranking-title">出場時間</span></div>
                <div id="list-minutes" class="ranking-list"></div>
            </div>

            <div class="ranking-card">
                <div class="ranking-label"><span class="ranking-title">警告数</span></div>
                <div id="list-cards" class="ranking-list"></div>
            </div>
        </div>
    </main>

    <footer class="p-20 text-center border-t border-white/5 mx-8 mt-12">
        <p class="font-oswald text-[0.55rem] tracking-[0.8em] opacity-30 uppercase">© 2026 Goalink / Powered by HEKION</p>
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbws0qWNqZ1mbNkdDtyLlnSIBQn7493OY-B-EXLzAGpcZlrZfhL8JIDR1ra5o0si_BYVAg/exec";
        let currentCategory = 'J1_EAST';

        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');
            const btn = document.getElementById('menuBtn');
            menu.classList.toggle('open');
            overlay.classList.toggle('show');
            btn.classList.toggle('active');
            document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : 'auto';
        }

        const pagetop = document.getElementById('pagetop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) { pagetop.classList.add('show'); } 
            else { pagetop.classList.remove('show'); }
        });

        function scrollToTop(e) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderPlaceholders() {
            const containers = ['list-goals', 'list-per90', 'list-minutes', 'list-cards'];
            containers.forEach(id => {
                let html = '';
                for (let i = 1; i <= 5; i++) {
                    html += `
                        <div class="player-row loading-shimmer">
                            <div class="rank-num ${i === 1 ? 'rank-1' : ''}">${i}</div>
                            <div class="player-info">
                                <div class="player-name text-zinc-800">----------</div>
                                <div class="player-team text-zinc-900">------</div>
                            </div>
                            <div class="stat-value text-zinc-800">--</div>
                        </div>
                    `;
                }
                document.getElementById(id).innerHTML = html;
            });
        }

        async function fetchRankings(category) {
            renderPlaceholders();
            try {
                const response = await fetch(`${SCRIPT_URL}?type=ranking&category=${category}`);
                const data = await response.json();
                renderList('list-goals', data.goals, 'GOALS');
                renderList('list-per90', data.per90, 'PTS');
                renderList('list-minutes', data.minutes, 'MIN');
                renderList('list-cards', data.cards, 'CARDS');
            } catch (error) {
                console.error("Fetch error:", error);
            }
        }

        function renderList(elementId, players, unit) {
            const container = document.getElementById(elementId);
            if (!players || players.length === 0) {
                container.innerHTML = '<div class="text-zinc-600 text-[0.65rem] py-10 text-center uppercase tracking-widest">No Data Available</div>';
                return;
            }
            container.innerHTML = players.map((player, index) => `
                <div class="player-row">
                    <div class="rank-num ${index === 0 ? 'rank-1' : ''}">${index + 1}</div>
                    <div class="player-info" style="border-color: ${player.color}">
                        <div class="player-name">${player.name}</div>
                        <div class="player-team">${player.team}</div>
                    </div>
                    <div class="stat-value">
                        ${player.per90 && unit === 'PTS' ? player.per90.toFixed(2) : (player[unit.toLowerCase()] || player.mins || player.cards).toLocaleString()}
                        <span class="stat-unit">${unit}</span>
                    </div>
                </div>
            `).join('');
        }

        function changeCategory(cat, el) {
            if (currentCategory === cat) return;
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            fetchRankings(cat);
        }

        renderPlaceholders();
        fetchRankings(currentCategory);
    </script>
</body>
</html>
