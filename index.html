<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goalink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Oswald:wght@300;500&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <style>
        :root { --main-cyan: #4bb8e0; --sumi-black: #0c0c0c; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--sumi-black); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; overflow-x: hidden; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        
        /* ヘッダー・共通パーツ */
        .site-logo { height: 3.5rem; width: auto; object-fit: contain; }
        .menu-trigger { width: 28px; height: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; cursor: pointer; z-index: 200; position: relative; }
        .menu-trigger span { display: block; height: 1px; background-color: #fff; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); }
        .menu-trigger span:nth-child(1) { width: 100%; }
        .menu-trigger span:nth-child(2) { width: 60%; }
        .active span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); width: 100%; }
        .active span:nth-child(2) { transform: translateY(-6.5px) rotate(-45deg); width: 100%; }

        #sideMenu {
            position: fixed; top: 0; right: -100%; width: 75%; height: 100%;
            background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(20px);
            z-index: 150; transition: right 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex; flex-direction: column; justify-content: center; padding-left: 12%;
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        #sideMenu.open { right: 0; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); opacity: 0; visibility: hidden; z-index: 100; transition: 0.6s; }
        #overlay.show { opacity: 1; visibility: visible; }

        .menu-item { opacity: 0; transform: translateX(20px); transition: 0.5s; margin-bottom: 2rem; }
        #sideMenu.open .menu-item { opacity: 1; transform: translateX(0); }

        .section-header { margin-bottom: 1.8rem; }
        .section-title-ja { font-family: 'Noto Serif JP', serif; font-size: 1.6rem; font-weight: 900; letter-spacing: 0.05em; display: block; line-height: 1.2; }
        .section-title-en { font-family: 'Oswald', sans-serif; font-size: 0.65rem; letter-spacing: 0.5em; color: var(--main-cyan); text-transform: uppercase; display: block; margin-bottom: 0.3rem; }

        /* ページトップボタン */
        #pagetop {
            position: fixed; right: 24px; bottom: 24px; width: 56px; height: 56px;
            background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 90; opacity: 0; visibility: hidden; transition: 0.4s; transform: translateY(10px);
            text-decoration: none;
        }
        #pagetop.show { opacity: 1; visibility: visible; transform: translateY(0); }
        #pagetop:hover { border-color: var(--main-cyan); }
        #pagetop svg { width: 14px; height: 14px; fill: var(--main-cyan); margin-bottom: 2px; }
        #pagetop span { font-family: 'Oswald', sans-serif; font-size: 0.55rem; color: var(--main-cyan); letter-spacing: 0.1em; font-weight: 500; }

        .fade-in { animation: fadeIn 1.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleMenu()"></div>

    <a href="#" id="pagetop" onclick="scrollToTop(event)">
        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
        <span>TOP</span>
    </a>

    <header class="h-28 px-8 flex justify-between items-center fixed top-0 w-full z-[200] bg-gradient-to-b from-black/95 to-transparent">
        <a href="index.html"><img src="goalinklogo.png" alt="Goalink" class="site-logo"></a>
        <div id="menuBtn" onclick="toggleMenu()" class="menu-trigger">
            <span></span>
            <span></span>
        </div>
    </header>

    <nav id="sideMenu">
        <div class="menu-item" style="transition-delay: 0.1s;"><a href="https://hekion.github.io/goalinkjp/schedule.html"><span class="font-serif text-2xl">試合日程</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">SCHEDULE</small></a></div>
        <div class="menu-item" style="transition-delay: 0.2s;"><a href="teams.html"><span class="font-serif text-2xl">チーム一覧</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">TEAMS</small></a></div>
        <div class="menu-item" style="transition-delay: 0.3s;"><a href="standing.html"><span class="font-serif text-2xl">順位表</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">STANDING</small></a></div>
        <div class="menu-item" style="transition-delay: 0.4s;"><a href="database.html"><span class="font-serif text-2xl">個人成績</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">STATS</small></a></div>
        
        <div class="mt-8 border-t border-white/10 pt-8 menu-item" style="transition-delay: 0.5s;">
            <a href="https://x.com/Goalink_JP" target="_blank" class="flex items-center gap-3 mb-6">
                <svg class="w-6 h-6 fill-white" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                <span class="font-serif text-xl text-gray-400">公式Xへ</span>
            </a>
            <a href="https://note.com/goalink_jp" target="_blank" class="flex items-center gap-3">
                <img src="https://note.com/favicon.ico" class="w-5 h-5 grayscale opacity-70" alt="">
                <span class="font-serif text-xl text-gray-400">公式noteへ</span>
            </a>
        </div>
    </nav>

    <div class="pt-28 w-full fade-in">
        <img src="hero.png" alt="" class="w-full aspect-video object-cover">
    </div>

    <main class="pt-12 px-8 max-w-screen-md mx-auto">
        <section class="mb-20 fade-in" style="animation-delay: 0.2s;">
            <div class="section-header">
                <span class="section-title-en">Next Matches</span>
                <span class="section-title-ja">次節対戦</span>
            </div>
            <div class="swiper nextSwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"><img src="next_j1.png"></div>
                    <div class="swiper-slide"><img src="next_j2.png"></div>
                    <div class="swiper-slide"><img src="next_j3.png"></div>
                </div>
            </div>
        </section>

        <section class="mb-28 fade-in" style="animation-delay: 0.4s;">
            <div class="section-header">
                <span class="section-title-en">Current Standings</span>
                <span class="section-title-ja">現在の順位</span>
            </div>
            <a href="standing.html" class="block">
                <div class="swiper standSwiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide"><img src="stand_j1.png"></div>
                        <div class="swiper-slide"><img src="stand_j2.png"></div>
                        <div class="swiper-slide"><img src="stand_j3.png"></div>
                    </div>
                </div>
            </a>
        </section>

        <div class="grid grid-cols-1 gap-6 mb-12 fade-in" style="animation-delay: 0.6s;">
            <a href="https://hekion.github.io/goalinkjp/schedule.html" class="bg-zinc-900/30 border-l-2 border-white/10 p-10 flex justify-between items-center group transition-all hover:bg-zinc-800/50">
                <span class="font-serif text-2xl">試合日程</span>
                <span class="opacity-20 group-hover:opacity-100 group-hover:translate-x-2 transition-all text-xl">→</span>
            </a>
            <a href="teams.html" class="bg-zinc-900/30 border-l-2 border-white/10 p-10 flex justify-between items-center group transition-all hover:bg-zinc-800/50">
                <span class="font-serif text-2xl">チーム一覧</span>
                <span class="opacity-20 group-hover:opacity-100 group-hover:translate-x-2 transition-all text-xl">→</span>
            </a>
            <a href="database.html" class="bg-zinc-900/30 border-l-2 border-white/10 p-10 flex justify-between items-center group transition-all hover:bg-zinc-800/50">
                <span class="font-serif text-2xl">個人成績</span>
                <span class="opacity-20 group-hover:opacity-100 group-hover:translate-x-2 transition-all text-xl">→</span>
            </a>
            <a href="https://note.com/goalink_jp" target="_blank" class="bg-zinc-900/30 border-l-2 border-white/10 p-10 flex justify-between items-center group transition-all hover:bg-zinc-800/50">
                <span class="font-serif text-2xl">公式noteへ</span>
                <span class="opacity-20 group-hover:opacity-100 group-hover:translate-x-2 transition-all text-xl">→</span>
            </a>
        </div>

        <div class="fade-in" style="animation-delay: 0.7s;">
            <a href="https://x.com/Goalink_JP" target="_blank" class="flex items-center justify-center gap-4 bg-white text-black py-4 px-8 rounded-full font-bold hover:bg-gray-200 transition-colors shadow-lg shadow-white/5">
                <svg class="w-5 h-5 fill-black" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                <span>最新情報をXでチェック</span>
            </a>
        </div>
    </main>

    <footer class="p-20 text-center border-t border-white/5 mx-8 mt-12 flex flex-col items-center">
        <p class="font-oswald text-[0.55rem] tracking-[0.8em] opacity-30 uppercase mb-8">© 2026 Goalink</p>
        <div class="flex items-center justify-center gap-4">
            <span class="font-oswald text-[0.55rem] tracking-[0.3em] uppercase opacity-30">Powered by</span>
            <a href="https://hekion.github.io/hekion/" target="_blank" class="block">
                <img src="hekionlogo.png" alt="HEKION" class="h-8 w-auto">
            </a>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
            document.getElementById('menuBtn').classList.toggle('active');
            document.body.style.overflow = document.getElementById('sideMenu').classList.contains('open') ? 'hidden' : 'auto';
        }

        const swiperConfig = {
            loop: true,
            effect: 'fade',
            fadeEffect: { crossFade: true },
            speed: 1000,
            autoplay: { delay: 5000, disableOnInteraction: false }
        };

        new Swiper('.nextSwiper', swiperConfig);
        new Swiper('.standSwiper', swiperConfig);

        const pagetop = document.getElementById('pagetop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) {
                pagetop.classList.add('show');
            } else {
                pagetop.classList.remove('show');
            }
        });

        function scrollToTop(e) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
