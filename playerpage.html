<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAYER DETAILS | Goalink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Oswald:wght@300;500&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --main-cyan: #4bb8e0; --sumi-black: #0c0c0c; }
        body { background-color: var(--sumi-black); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; overflow-x: hidden; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }

        .menu-trigger { width: 28px; height: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; cursor: pointer; z-index: 200; position: relative; }
        .menu-trigger span { display: block; height: 1px; background-color: #fff; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); }
        .menu-trigger span:nth-child(1) { width: 100%; }
        .menu-trigger span:nth-child(2) { width: 60%; }
        .active span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); width: 100%; }
        .active span:nth-child(2) { transform: translateY(-6.5px) rotate(-45deg); width: 100%; }

        #sideMenu {
            position: fixed; top: 0; right: -100%; width: 75%; height: 100%;
            background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(20px);
            z-index: 150; transition: right 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex; flex-direction: column; justify-content: center; padding-left: 12%;
        }
        #sideMenu.open { right: 0; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); opacity: 0; visibility: hidden; z-index: 100; transition: 0.6s; }
        #overlay.show { opacity: 1; visibility: visible; }
        .menu-item { opacity: 0; transform: translateX(20px); transition: 0.5s; margin-bottom: 2rem; }
        #sideMenu.open .menu-item { opacity: 1; transform: translateX(0); }

        .loader { width: 24px; height: 24px; border: 2px solid var(--main-cyan); border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-message { font-family: 'Noto Sans JP', sans-serif; font-size: 0.8rem; color: #ff6b6b; border: 1px solid #ff6b6b; padding: 1rem; border-radius: 2px; background: rgba(255, 107, 107, 0.05); }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleMenu()"></div>
    <header class="h-28 px-8 flex justify-between items-center fixed top-0 w-full z-[200] bg-gradient-to-b from-black/95 to-transparent">
        <a href="index.html"><img src="goalinklogo.png" alt="Goalink" class="h-14"></a>
        <div id="menuBtn" onclick="toggleMenu()" class="menu-trigger"><span></span><span></span></div>
    </header>

    <nav id="sideMenu">
        <div class="menu-item" style="transition-delay: 0.1s;"><a href="#"><span class="font-serif text-2xl opacity-50 text-white">試合日程</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">SCHEDULE</small></a></div>
        <div class="menu-item" style="transition-delay: 0.2s;"><a href="teams.html"><span class="font-serif text-2xl text-white">チーム一覧</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">TEAMS</small></a></div>
        <div class="menu-item" style="transition-delay: 0.3s;"><a href="standing.html"><span class="font-serif text-2xl text-white">順位表</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">STANDING</small></a></div>
        <div class="menu-item" style="transition-delay: 0.4s;"><a href="database.html"><span class="font-serif text-2xl text-white">個人成績</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">PLAYERS</small></a></div>
        <div class="menu-item" style="transition-delay: 0.5s;"><a href="https://note.com/goalink_jp" target="_blank"><span class="font-serif text-2xl text-white">節スタッツまとめ</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">STATS SUMMARY</small></a></div>
    </nav>

    <main class="pt-48 pb-20 px-6 max-w-screen-md mx-auto">
        <div id="loading" class="text-center py-20">
            <span class="loader"></span>
            <p class="font-oswald text-[0.6rem] tracking-widest mt-4 opacity-30 uppercase">Loading Player Data...</p>
        </div>

        <div id="errorMessage" class="hidden text-center py-20 error-message">
            選手の読み込みに失敗しました。<br>通信環境を確認するか、時間をおいて再度お試しください。
        </div>

        <div id="playerContent" class="hidden">
            <div class="mb-12">
                <a id="backBtn" href="#" class="font-oswald text-[0.6rem] tracking-[0.4em] text-white/30 hover:text-white mb-6 inline-block uppercase italic transition-colors">← Back to Team</a>
                <div class="flex items-baseline gap-4 mb-2">
                    <span id="playerPos" class="font-oswald text-sm text-gray-400 tracking-widest uppercase"></span>
                    <span id="playerNumber" class="font-oswald text-4xl font-light italic"></span>
                </div>
                <h1 id="playerName" class="text-white text-5xl md:text-7xl font-serif font-black tracking-tighter italic leading-none mb-6"></h1>
                <div id="accentBar" class="h-1 w-24"></div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-12 border-t border-white/10 pt-12">
                <section>
                    <h2 class="font-oswald text-[0.6rem] tracking-[0.4em] text-white/30 mb-8 uppercase italic underline decoration-1 underline-offset-8">Bio Data</h2>
                    <dl class="space-y-6">
                        <div class="flex justify-between border-b border-white/5 pb-2">
                            <dt class="font-serif text-xs opacity-50">生年月日</dt>
                            <dd id="playerBirth" class="font-oswald text-sm tracking-widest"></dd>
                        </div>
                        <div class="flex justify-between border-b border-white/5 pb-2">
                            <dt class="font-serif text-xs opacity-50">身長 / 体重</dt>
                            <dd class="font-oswald text-sm tracking-widest"><span id="playerHeight"></span>cm / <span id="playerWeight"></span>kg</dd>
                        </div>
                    </dl>
                </section>

                <section>
                    <h2 class="font-oswald text-[0.6rem] tracking-[0.4em] text-white/30 mb-8 uppercase italic underline decoration-1 underline-offset-8">Season Stats</h2>
                    <div class="grid grid-cols-3 gap-8 text-center font-oswald">
                        <div><span class="block text-[0.5rem] opacity-30 mb-2 font-serif">出場</span><span id="stat-games" class="text-2xl font-light"></span></div>
                        <div><span class="block text-[0.5rem] opacity-30 mb-2 font-serif">得点</span><span id="stat-goals" class="text-2xl font-light"></span></div>
                        <div><span class="block text-[0.5rem] opacity-30 mb-2 font-serif">警告</span><span id="stat-yel" class="text-2xl font-light"></span></div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="p-20 text-center border-t border-white/5 mx-8">
        <p class="font-oswald text-[0.55rem] tracking-[0.8em] opacity-30 uppercase">© 2026 Goalink / Powered by HEKION</p>
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcIbOA514BcUjssR78RqoWbp4bYM_eo6b3CtNPJt-9FxDrfY_5EFy9HSnTOtjG9Ytb/exec";

        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');
            const btn = document.getElementById('menuBtn');
            menu.classList.toggle('open');
            overlay.classList.toggle('show');
            btn.classList.toggle('active');
            document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : 'auto';
        }

        async function loadPlayerDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const playerId = urlParams.get('id');
            const teamId = urlParams.get('tid');

            if (!playerId || !teamId) return;

            // 戻るボタンのリンク先を設定
            document.getElementById('backBtn').href = `teampage.html?id=${teamId}`;

            try {
                const response = await fetch(`${SCRIPT_URL}?id=${teamId}`);
                if (!response.ok) throw new Error('Fetch failed');
                
                const data = await response.json();
                const player = data.players.find(p => p.id == playerId);

                if (!player) throw new Error('Player not found');

                // データの流し込み
                document.getElementById('playerName').textContent = player.name;
                document.getElementById('playerNumber').textContent = `#${player.number}`;
                document.getElementById('playerPos').textContent = player.position;
                document.getElementById('playerBirth').textContent = player.birthday || '----.--.--';
                document.getElementById('playerHeight').textContent = player.height || '---';
                document.getElementById('playerWeight').textContent = player.weight || '--';
                
                document.getElementById('stat-games').textContent = player.games || '0';
                document.getElementById('stat-goals').textContent = player.goals || '0';
                document.getElementById('stat-yel').textContent = player.yellow || '0';
                
                document.getElementById('accentBar').style.backgroundColor = data.teamColor || '#FFFFFF';

                // 表示の切り替え
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('playerContent').classList.remove('hidden');

            } catch (e) {
                console.error(e);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('errorMessage').classList.remove('hidden');
            }
        }

        loadPlayerDetail();
    </script>
</body>
</html>
