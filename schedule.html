<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCHEDULE - Goalink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Oswald:wght@300;500&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --main-cyan: #4bb8e0; --sumi-black: #0c0c0c; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--sumi-black); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; overflow-x: hidden; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        
        /* 共通ヘッダー・メニュー */
        .site-logo { height: 3.5rem; width: auto; object-fit: contain; }
        .menu-trigger { width: 28px; height: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; cursor: pointer; z-index: 200; position: relative; }
        .menu-trigger span { display: block; height: 1px; background-color: #fff; transition: 0.5s; }
        .menu-trigger span:nth-child(1) { width: 100%; }
        .menu-trigger span:nth-child(2) { width: 60%; }
        .active span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); width: 100%; }
        .active span:nth-child(2) { transform: translateY(-6.5px) rotate(-45deg); width: 100%; }

        #sideMenu {
            position: fixed; top: 0; right: -100%; width: 75%; height: 100%;
            background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(20px);
            z-index: 150; transition: right 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex; flex-direction: column; justify-content: center; padding-left: 12%;
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        #sideMenu.open { right: 0; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); opacity: 0; visibility: hidden; z-index: 100; transition: 0.6s; }
        #overlay.show { opacity: 1; visibility: visible; }

        .section-header { margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 1rem; }
        .section-title-ja { font-family: 'Noto Serif JP', serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 0.05em; display: block; }
        .section-title-en { font-family: 'Oswald', sans-serif; font-size: 0.7rem; letter-spacing: 0.5em; color: var(--main-cyan); text-transform: uppercase; display: block; margin-bottom: 0.5rem; }

        /* 月別ボタン */
        .month-btn { 
            font-family: 'Oswald', sans-serif;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.5rem 1rem;
            transition: 0.3s;
        }
        .month-btn.active { border-color: var(--main-cyan); color: var(--main-cyan); background: rgba(75, 184, 224, 0.1); }

        /* 試合カード */
        .match-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); }
        .score-box { background: #000; min-width: 80px; text-align: center; padding: 0.75rem; border-radius: 4px; }
        .score-num { font-family: 'Oswald', sans-serif; font-size: 1.5rem; font-weight: 500; letter-spacing: 0.1em; }
        .vs-text { color: var(--main-cyan); font-family: 'Oswald', sans-serif; font-weight: 500; }

        #pagetop {
            position: fixed; right: 24px; bottom: 24px; width: 56px; height: 56px;
            background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 90; opacity: 0; visibility: hidden; transition: 0.4s; text-decoration: none;
        }
        #pagetop.show { opacity: 1; visibility: visible; }
        #pagetop svg { width: 14px; height: 14px; fill: var(--main-cyan); margin-bottom: 2px; }
        #pagetop span { font-family: 'Oswald', sans-serif; font-size: 0.55rem; color: var(--main-cyan); }

        .fade-in { animation: fadeIn 1s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleMenu()"></div>

    <a href="#" id="pagetop" onclick="scrollToTop(event)">
        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
        <span>TOP</span>
    </a>

    <header class="h-28 px-8 flex justify-between items-center fixed top-0 w-full z-[200] bg-gradient-to-b from-black/95 to-transparent">
        <a href="index.html"><img src="goalinklogo.png" alt="Goalink" class="site-logo"></a>
        <div id="menuBtn" onclick="toggleMenu()" class="menu-trigger">
            <span></span>
            <span></span>
        </div>
    </header>

    <nav id="sideMenu">
        <div class="mb-8"><a href="index.html" class="font-serif text-2xl opacity-50">TOP</a></div>
        <div class="mb-8"><a href="schedule.html"><span class="font-serif text-2xl text-[#4bb8e0]">試合日程</span><small class="font-oswald ml-3 text-[0.6rem] tracking-[0.3em]">SCHEDULE</small></a></div>
        <div class="mb-8"><a href="teams.html"><span class="font-serif text-2xl">チーム一覧</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">TEAMS</small></a></div>
        <div class="mb-8"><a href="standing.html"><span class="font-serif text-2xl">順位表</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">STANDING</small></a></div>
        <div class="mb-8"><a href="database.html"><span class="font-serif text-2xl">個人成績</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">PLAYERS</small></a></div>
    </nav>

    <main class="pt-32 px-6 max-w-screen-md mx-auto min-h-screen">
        <div class="section-header fade-in">
            <span class="section-title-en" id="en-title">MATCH SCHEDULE</span>
            <span class="section-title-ja" id="ja-title">試合日程</span>
        </div>

        <div class="flex flex-wrap gap-2 mb-10 fade-in" style="animation-delay: 0.1s;">
            <button class="month-btn active" onclick="filterMonth('')">ALL</button>
            <button class="month-btn" onclick="filterMonth('2')">FEB</button>
            <button class="month-btn" onclick="filterMonth('3')">MAR</button>
            <button class="month-btn" onclick="filterMonth('4')">APR</button>
            <button class="month-btn" onclick="filterMonth('5')">MAY</button>
        </div>

        <div id="schedule-list" class="space-y-4 pb-20 fade-in" style="animation-delay: 0.2s;">
            <div class="text-center py-20 text-gray-500 font-oswald tracking-widest">LOADING...</div>
        </div>
    </main>

    <footer class="p-20 text-center border-t border-white/5 mx-8 mt-12">
        <p class="font-oswald text-[0.55rem] tracking-[0.8em] opacity-30 uppercase">© 2026 Goalink / Powered by HEKION</p>
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytul6B0qqse-KLLsXZgMVml9FCjBvo0V42-FQ6p9C1U7ReCvt1BwVWnkoQOPdYRBq8/exec";
        
        const params = new URLSearchParams(window.location.search);
        const teamId = params.get('id');
        const category = params.get('cat');
        let currentMonth = "";

        async function loadSchedule() {
            const listDiv = document.getElementById('schedule-list');
            let fetchUrl = `${SCRIPT_URL}?`;
            if (teamId) fetchUrl += `id=${teamId}`;
            if (category) fetchUrl += (teamId ? "&" : "") + `cat=${category}`;
            if (currentMonth) fetchUrl += `&month=${currentMonth}`;

            try {
                const response = await fetch(fetchUrl);
                const data = await response.json();

                if (data.matches && data.matches.length > 0) {
                    listDiv.innerHTML = "";
                    data.matches.forEach(match => {
                        const isFinished = match.homeScore !== "" && match.awayScore !== "";
                        const scoreDisplay = isFinished 
                            ? `<div class="score-num">${match.homeScore} - ${match.awayScore}</div>`
                            : `<div class="vs-text">VS</div>`;

                        const html = `
                            <div class="match-card p-5 rounded-sm">
                                <div class="flex justify-between text-[0.65rem] font-oswald text-gray-500 tracking-tighter mb-4 border-b border-white/5 pb-2">
                                    <span>${match.section}</span>
                                    <span>${match.date} ${match.time}</span>
                                </div>
                                <div class="flex items-center justify-between gap-2">
                                    <div class="flex-1 text-center font-serif text-lg">${match.homeName}</div>
                                    <div class="score-box">${scoreDisplay}</div>
                                    <div class="flex-1 text-center font-serif text-lg">${match.awayName}</div>
                                </div>
                                <div class="mt-4 text-center text-[0.6rem] text-gray-500 font-oswald tracking-widest uppercase">
                                    at ${match.stadium}
                                </div>
                            </div>
                        `;
                        listDiv.insertAdjacentHTML('beforeend', html);
                    });
                } else {
                    listDiv.innerHTML = '<div class="text-center py-20 text-gray-500 font-oswald tracking-widest">NO MATCHES FOUND</div>';
                }
            } catch (e) {
                listDiv.innerHTML = '<div class="text-center py-20 text-red-900 font-oswald tracking-widest">ERROR LOADING DATA</div>';
            }
        }

        function filterMonth(m) {
            currentMonth = m;
            document.querySelectorAll('.month-btn').forEach(btn => {
                btn.classList.remove('active');
                if((m === '' && btn.innerText === 'ALL') || (m !== '' && btn.innerText.includes(m === '2' ? 'FEB' : m === '3' ? 'MAR' : m === '4' ? 'APR' : 'MAY'))) {
                    btn.classList.add('active');
                }
            });
            loadSchedule();
        }

        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
            document.getElementById('menuBtn').classList.toggle('active');
        }

        function scrollToTop(e) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        window.addEventListener('scroll', () => {
            const pt = document.getElementById('pagetop');
            window.scrollY > 400 ? pt.classList.add('show') : pt.classList.remove('show');
        });

        loadSchedule();
    </script>
</body>
</html>
