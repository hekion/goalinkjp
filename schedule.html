<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCHEDULE HUB - Goalink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Oswald:wght@300;500&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --main-cyan: #4bb8e0; --sumi-black: #0c0c0c; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--sumi-black); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; overflow-x: hidden; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        
        .site-logo { height: 3.5rem; width: auto; object-fit: contain; }
        .menu-trigger { width: 28px; height: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; cursor: pointer; z-index: 200; position: relative; }
        .menu-trigger span { display: block; height: 1px; background-color: #fff; transition: 0.5s; }
        .menu-trigger span:nth-child(1) { width: 100%; }
        .menu-trigger span:nth-child(2) { width: 60%; }
        .active span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); width: 100%; }
        .active span:nth-child(2) { transform: translateY(-6.5px) rotate(-45deg); width: 100%; }

        #sideMenu {
            position: fixed; top: 0; right: -100%; width: 75%; height: 100%;
            background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(20px);
            z-index: 150; transition: right 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex; flex-direction: column; justify-content: center; padding-left: 12%;
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        #sideMenu.open { right: 0; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); opacity: 0; visibility: hidden; z-index: 100; transition: 0.6s; }
        #overlay.show { opacity: 1; visibility: visible; }

        .nav-link-active { color: var(--main-cyan) !important; }
        .nav-link-inactive { color: #fff; opacity: 0.5; }

        .section-header { margin-bottom: 2.5rem; }
        .section-title-ja { font-family: 'Noto Serif JP', serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 0.05em; display: block; }
        .section-title-en { font-family: 'Oswald', sans-serif; font-size: 0.7rem; letter-spacing: 0.5em; color: var(--main-cyan); text-transform: uppercase; display: block; margin-bottom: 0.5rem; }

        .hub-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 2.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }
        .hub-card::before {
            content: ''; position: absolute; left: 0; top: 0; height: 100%; width: 3px;
            background: var(--border-color, #333); transition: width 0.3s; z-index: 0;
        }
        .hub-card:hover { background: rgba(255,255,255,0.07); transform: translateX(10px); }
        .hub-card:hover::before { width: 6px; }

        .fade-in { animation: fadeIn 1s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleMenu()"></div>

    <header class="h-28 px-8 flex justify-between items-center fixed top-0 w-full z-[200] bg-gradient-to-b from-black/95 to-transparent">
        <a href="index.html"><img src="goalinklogo.png" alt="Goalink" class="site-logo"></a>
        <div id="menuBtn" onclick="toggleMenu()" class="menu-trigger">
            <span></span>
            <span></span>
        </div>
    </header>

    <nav id="sideMenu">
        <div class="mb-8"><a href="index.html" class="font-serif text-2xl nav-link-inactive hover:opacity-100 transition-all">TOP</a></div>
        <div class="mb-8"><a href="schedule.html" class="font-serif text-2xl nav-link-active">試合日程<small class="font-oswald ml-3 text-[0.6rem] tracking-[0.3em] text-[#4bb8e0]">SCHEDULE</small></a></div>
        <div class="mb-8"><a href="teams.html" class="font-serif text-2xl nav-link-inactive hover:opacity-100 transition-all">チーム一覧<small class="font-oswald ml-3 text-[0.6rem] tracking-[0.3em] text-[#4bb8e0]">TEAMS</small></a></div>
        <div class="mb-8"><a href="standing.html" class="font-serif text-2xl nav-link-inactive hover:opacity-100 transition-all">順位表<small class="font-oswald ml-3 text-[0.6rem] tracking-[0.3em] text-[#4bb8e0]">STANDING</small></a></div>
        <div class="mb-8"><a href="database.html" class="font-serif text-2xl nav-link-inactive hover:opacity-100 transition-all">個人成績<small class="font-oswald ml-3 text-[0.6rem] tracking-[0.3em] text-[#4bb8e0]">PLAYERS</small></a></div>
    </nav>

    <main class="pt-40 px-8 max-w-screen-md mx-auto min-h-screen">
        <div class="section-header fade-in">
            <span class="section-title-en">Select Category</span>
            <span class="section-title-ja">試合日程</span>
        </div>

        <div class="grid grid-cols-1 gap-6 fade-in" style="animation-delay: 0.2s;">
            
            <a href="schedule_all.html" class="hub-card" style="--border-color: #ffffff;">
                <div class="relative z-10">
                    <span class="font-serif text-2xl block mb-1">全カテゴリ 総合日程</span>
                    <small class="font-oswald text-[0.6rem] opacity-40 tracking-[0.3em] uppercase">All League Combined</small>
                </div>
                <span class="text-white opacity-20 text-xl font-light">→</span>
            </a>

            <a href="schedule_j1.html" class="hub-card" style="--border-color: #4bb8e0;">
                <div class="relative z-10">
                    <span class="font-serif text-2xl block mb-1">J1 リーグ日程</span>
                    <small class="font-oswald text-[0.6rem] text-[#4bb8e0] tracking-[0.3em] uppercase">J1 League Matches</small>
                </div>
                <span class="text-[#4bb8e0] opacity-40 text-xl font-light">→</span>
            </a>

            <a href="schedule_j2.html" class="hub-card" style="--border-color: #10b981;">
                <div class="relative z-10">
                    <span class="font-serif text-2xl block mb-1">J2.J3 EAST 日程</span>
                    <small class="font-oswald text-[0.6rem] text-[#10b981] tracking-[0.3em] uppercase">East Area (J2/J3)</small>
                </div>
                <span class="text-[#10b981] opacity-40 text-xl font-light">→</span>
            </a>

            <a href="schedule_j3.html" class="hub-card" style="--border-color: #f43f5e;">
                <div class="relative z-10">
                    <span class="font-serif text-2xl block mb-1">J2.J3 WEST 日程</span>
                    <small class="font-oswald text-[0.6rem] text-[#f43f5e] tracking-[0.3em] uppercase">West Area (J2/J3)</small>
                </div>
                <span class="text-[#f43f5e] opacity-40 text-xl font-light">→</span>
            </a>

        </div>
    </main>

    <footer class="p-20 text-center border-t border-white/5 mx-8 mt-12">
        <p class="font-oswald text-[0.55rem] tracking-[0.8em] opacity-30 uppercase">© 2026 Goalink / Powered by HEKION</p>
    </footer>

    <script>
        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
            document.getElementById('menuBtn').classList.toggle('active');
        }
    </script>
</body>
</html>
