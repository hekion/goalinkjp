<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCHEDULE | Goalink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Oswald:wght@300;500&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --main-cyan: #4bb8e0; --sumi-black: #0c0c0c; }
        html { scroll-behavior: smooth; }
        body { background-color: var(--sumi-black); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; overflow-x: hidden; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        
        /* ヘッダー・共通パーツ */
        .site-logo { height: 3.5rem; width: auto; object-fit: contain; }
        .menu-trigger { width: 28px; height: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; cursor: pointer; z-index: 200; position: relative; }
        .menu-trigger span { display: block; height: 1px; background-color: #fff; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); }
        .menu-trigger span:nth-child(1) { width: 100%; }
        .menu-trigger span:nth-child(2) { width: 60%; }
        .active span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); width: 100%; }
        .active span:nth-child(2) { transform: translateY(-6.5px) rotate(-45deg); width: 100%; }

        #sideMenu { position: fixed; top: 0; right: -100%; width: 75%; height: 100%; background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(20px); z-index: 150; transition: right 0.7s cubic-bezier(0.19, 1, 0.22, 1); display: flex; flex-direction: column; justify-content: center; padding-left: 12%; border-left: 1px solid rgba(255,255,255,0.1); }
        #sideMenu.open { right: 0; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); opacity: 0; visibility: hidden; z-index: 100; transition: 0.6s; }
        #overlay.show { opacity: 1; visibility: visible; }
        .menu-item { opacity: 0; transform: translateX(20px); transition: 0.5s; margin-bottom: 2rem; }
        #sideMenu.open .menu-item { opacity: 1; transform: translateX(0); }

        /* 大見出し */
        .page-header { margin-bottom: 2rem; }
        .page-title-en { font-family: 'Oswald', sans-serif; font-size: 0.7rem; letter-spacing: 0.5em; color: var(--main-cyan); text-transform: uppercase; display: block; margin-bottom: 0.5rem; }
        .page-title-ja { font-family: 'Noto Serif JP', serif; font-size: 1.8rem; font-weight: 900; letter-spacing: 0.05em; display: block; }

        /* 日程トップに戻るボタン（schedule.htmlへ） */
        .back-to-schedule-btn { display: inline-flex; align-items: center; gap: 10px; font-family: 'Oswald', sans-serif; font-size: 0.65rem; letter-spacing: 0.2em; color: #fff; border: 1px solid rgba(255, 255, 255, 0.1); padding: 0.8rem 1.5rem; margin-bottom: 2.5rem; transition: 0.3s; background: rgba(255,255,255,0.03); }
        .back-to-schedule-btn:hover { border-color: var(--main-cyan); color: var(--main-cyan); background: rgba(75, 184, 224, 0.05); }

        /* フィルタデザイン */
        .month-container { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; padding: 10px 0; -ms-overflow-style: none; scrollbar-width: none; }
        .month-container::-webkit-scrollbar { display: none; }
        .month-btn { flex: 0 0 auto; font-family: 'Oswald', sans-serif; font-size: 0.7rem; padding: 0.5rem 1rem; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); cursor: pointer; transition: 0.2s; background: transparent; letter-spacing: 0.1em; }
        .month-btn.active { background: var(--main-cyan); color: #000; border-color: var(--main-cyan); font-weight: 600; }

        .area-tab { flex: 1; text-align: center; padding: 0.8rem 0.2rem; font-family: 'Oswald', sans-serif; font-size: 0.6rem; border-bottom: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.3); cursor: pointer; letter-spacing: 0.05em; }
        .area-tab.active { color: var(--main-cyan); border-bottom: 2px solid var(--main-cyan); background: rgba(75, 184, 224, 0.05); }

        /* 試合カード */
        .match-card { background: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%); border-left: 2px solid var(--main-cyan); padding: 1.2rem 1.5rem; margin-bottom: 1.2rem; }
        .tag { font-family: 'Oswald', sans-serif; font-size: 0.6rem; padding: 2px 8px; border-width: 1.5px; border-style: solid; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; display: inline-block; border-radius: 2px; }
        .color-line { height: 4px; width: 60px; margin-top: 6px; display: block; border-radius: 2px; }
        @media (min-width: 768px) { .color-line { width: 160px; } }

        /* ページトップボタン（浮遊） */
        #pagetop { position: fixed; right: 24px; bottom: 24px; width: 56px; height: 56px; background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 90; opacity: 0; visibility: hidden; transition: 0.4s; transform: translateY(10px); text-decoration: none; }
        #pagetop.show { opacity: 1; visibility: visible; transform: translateY(0); }
        #pagetop svg { width: 14px; height: 14px; fill: var(--main-cyan); margin-bottom: 2px; }
        #pagetop span { font-family: 'Oswald', sans-serif; font-size: 0.55rem; color: var(--main-cyan); letter-spacing: 0.1em; font-weight: 500; }

        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleMenu()"></div>

    <a href="#" id="pagetop" onclick="scrollToTop(event)">
        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
        <span>TOP</span>
    </a>

    <header class="h-28 px-8 flex justify-between items-center fixed top-0 w-full z-[200] bg-gradient-to-b from-black/95 to-transparent">
        <a href="index.html"><img src="goalinklogo.png" alt="Goalink" class="site-logo"></a>
        <div id="menuBtn" onclick="toggleMenu()" class="menu-trigger">
            <span></span><span></span>
        </div>
    </header>

    <nav id="sideMenu">
        <div class="menu-item" style="transition-delay: 0.1s;"><a href="https://hekion.github.io/goalinkjp/schedule.html"><span class="font-serif text-2xl text-[#4bb8e0]">試合日程</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">SCHEDULE</small></a></div>
        <div class="menu-item" style="transition-delay: 0.2s;"><a href="teams.html"><span class="font-serif text-2xl">チーム一覧</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">TEAMS</small></a></div>
        <div class="menu-item" style="transition-delay: 0.3s;"><a href="standing.html"><span class="font-serif text-2xl">順位表</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">STANDING</small></a></div>
        <div class="menu-item" style="transition-delay: 0.4s;"><a href="database.html"><span class="font-serif text-2xl">個人成績</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">PLAYERS</small></a></div>
        <div class="menu-item" style="transition-delay: 0.5s;"><a href="https://note.com/goalink_jp" target="_blank"><span class="font-serif text-2xl">節スタッツまとめ</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">STATS SUMMARY</small></a></div>
        
        <div class="mt-8 border-t border-white/10 pt-8 menu-item" style="transition-delay: 0.6s;">
            <a href="https://x.com/Goalink_JP" target="_blank" class="flex items-center gap-3">
                <svg class="w-6 h-6 fill-white" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                <span class="font-serif text-xl text-gray-400">公式Xへ</span>
            </a>
        </div>
    </nav>

    <main class="pt-40 px-6 max-w-screen-md mx-auto min-h-screen">
        
        <div class="page-header fade-in">
            <span class="page-title-en">ALL MATCHES</span>
            <span class="page-title-ja">全カテゴリ日程</span>
        </div>

        <div class="fade-in" style="animation-delay: 0.05s;">
            <a href="https://hekion.github.io/goalinkjp/schedule.html" class="back-to-schedule-btn">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                <span>BACK TO SCHEDULE TOP</span>
            </a>
        </div>

        <div class="fade-in" style="animation-delay: 0.1s;">
            <div id="month-filters" class="month-container mb-4"></div>
            
            <div class="flex mb-10 border-t border-white/5">
                <div class="area-tab active" onclick="updateFilters('category', 'ALL', this)">ALL</div>
                <div class="area-tab" onclick="updateFilters('category', 'J1', this)">J1</div>
                <div class="area-tab" onclick="updateFilters('category', 'J2_J3_E', this)">J2.J3 EAST</div>
                <div class="area-tab" onclick="updateFilters('category', 'J2_J3_W', this)">J2.J3 WEST</div>
            </div>
        </div>

        <div id="schedule-list" class="pb-24 fade-in" style="animation-delay: 0.2s;"></div>
    </main>

    <footer class="p-20 text-center border-t border-white/5 mx-8">
        <p class="font-oswald text-[0.55rem] tracking-[0.8em] opacity-30 uppercase">© 2026 Goalink / Powered by HEKION</p>
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytul6B0qqse-KLLsXZgMVml9FCjBvo0V42-FQ6p9C1U7ReCvt1BwVWnkoQOPdYRBq8/exec";
        let allMatches = [];
        let filterState = { category: 'ALL', month: 'ALL' };
        
        const TEAM_DATA = { 1:{color:"#FF0000"}, 2:{color:"#00A968"}, 3:{color:"#FFD700"}, 4:{color:"#3498DB"}, 5:{color:"#2E59FF"}, 6:{color:"#FF2200"}, 7:{color:"#FF4422"}, 8:{color:"#FF3131"}, 9:{color:"#3182FF"}, 10:{color:"#FFFF00"}, 11:{color:"#24409E"}, 12:{color:"#1B2E53"}, 13:{color:"#FF0000"}, 14:{color:"#FF7700"}, 15:{color:"#FFEE00"}, 16:{color:"#FFF200"}, 17:{color:"#2E59FF"}, 18:{color:"#00B379"}, 19:{color:"#24409E"}, 20:{color:"#00B2E5"}, 21:{color:"#0055FF"}, 22:{color:"#56A9E3"}, 23:{color:"#77FF00"}, 24:{color:"#008040"}, 25:{color:"#3344BB"}, 26:{color:"#007733"}, 27:{color:"#FF8800"}, 28:{color:"#FF6600"}, 29:{color:"#2E59FF"}, 30:{color:"#FF0000"}, 31:{color:"#FF9900"}, 32:{color:"#99CCFF"}, 33:{color:"#CC99FF"}, 34:{color:"#FF2200"}, 35:{color:"#008855"}, 36:{color:"#33CCFF"}, 37:{color:"#CF73FF"}, 38:{color:"#3D5AFF"}, 39:{color:"#FF77BB"}, 40:{color:"#33BBFF"}, 41:{color:"#A02040"}, 42:{color:"#2244AA"}, 43:{color:"#AAFF22"}, 44:{color:"#C7243A"}, 45:{color:"#B37DFF"}, 46:{color:"#FF6600"}, 47:{color:"#99DDFF"}, 48:{color:"#0055AA"}, 49:{color:"#FF8800"}, 50:{color:"#223366"}, 51:{color:"#FF2200"}, 52:{color:"#122A5B"}, 53:{color:"#FFFF00"}, 54:{color:"#77CCFF"}, 55:{color:"#0000FF"}, 56:{color:"#FF0000"}, 57:{color:"#2E59FF"}, 58:{color:"#FFFFFF"}, 59:{color:"#334466"}, 60:{color:"#A02040"} };

        async function initLoad() {
            try {
                const types = ['j1', 'j2j3_east', 'j2j3_west'];
                const results = await Promise.all(types.map(t => fetch(`${SCRIPT_URL}?type=${t}`).then(r => r.json())));
                allMatches = results.flatMap(r => r.matches || []).map(m => {
                    const parts = String(m.date).split('/');
                    const mVal = parts.length >= 2 ? parseInt(parts[1]) : 0;
                    return { ...m, mNum: mVal, mLabel: mVal + "月" };
                });
                generateMonthButtons();
                render();
            } catch (e) { document.getElementById('schedule-list').innerHTML = 'LOAD ERROR'; }
        }

        function generateMonthButtons() {
            const container = document.getElementById('month-filters');
            const months = [...new Set(allMatches.map(m => m.mNum))].filter(n => n > 0).sort((a,b) => a-b);
            let html = `<button class="month-btn active" onclick="updateFilters('month', 'ALL', this)">ALL</button>`;
            months.forEach(m => html += `<button class="month-btn" onclick="updateFilters('month', '${m}月', this)">${m}月</button>`);
            container.innerHTML = html;
        }

        function updateFilters(type, value, el) {
            if (type === 'category') filterState.category = value;
            else filterState.month = value;
            document.querySelectorAll(type === 'category' ? '.area-tab' : '.month-btn').forEach(x => x.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function render() {
            const listDiv = document.getElementById('schedule-list');
            let filtered = allMatches.filter(m => (filterState.category === 'ALL' || String(m.source).startsWith(filterState.category)) && (filterState.month === 'ALL' || m.mLabel === filterState.month));
            filtered.sort((a,b) => String(a.date).localeCompare(String(b.date)) || String(a.time).localeCompare(String(b.time)));
            
            listDiv.innerHTML = filtered.map(match => {
                const hColor = TEAM_DATA[Number(match.homeId)]?.color || "#333", aColor = TEAM_DATA[Number(match.awayId)]?.color || "#333";
                let s = String(match.source), label = s, color = "#fff";
                if (s === 'J1_E') { label = "J1 EAST"; color = "#4bb8e0"; }
                else if (s === 'J1_W') { label = "J1 WEST"; color = "#3b82f6"; }
                else if (s === 'J2_J3_EA') { label = "J2.J3 EAST-A"; color = "#10b981"; }
                else if (s === 'J2_J3_EB') { label = "J2.J3 EAST-B"; color = "#34d399"; }
                else if (s === 'J2_J3_WA') { label = "J2.J3 WEST-A"; color = "#f59e0b"; }
                else if (s === 'J2_J3_WB') { label = "J2.J3 WEST-B"; color = "#f43f5e"; }

                return `<div class="match-card">
                    <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mb-6 font-oswald text-[0.7rem] text-zinc-400">
                        <span class="font-serif text-white font-bold text-xs">第${match.section}節</span>
                        <span class="tag" style="color:${color}; border-color:${color}; background:rgba(255,255,255,0.05);">${label}</span>
                        <span>${match.date} ${match.time}</span><span class="text-zinc-500">${match.stadium}</span>
                    </div>
                    <div class="flex items-center justify-center">
                        <div class="flex-1 flex flex-col items-center text-center font-serif text-lg md:text-xl"><span>${match.homeShort}</span><span class="color-line" style="background:${hColor}"></span></div>
                        <div class="mx-4 text-center">${match.homeScore && match.homeScore!=="-" ? `<span class="font-oswald text-2xl font-medium">${match.homeScore}-${match.awayScore}</span>` : `<span class="font-oswald font-bold text-[#4bb8e0] text-xs">VS</span>`}</div>
                        <div class="flex-1 flex flex-col items-center text-center font-serif text-lg md:text-xl"><span>${match.awayShort}</span><span class="color-line" style="background:${aColor}"></span></div>
                    </div>
                </div>`;
            }).join('');
        }

        // メニュー制御
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');
            const btn = document.getElementById('menuBtn');
            menu.classList.toggle('open');
            overlay.classList.toggle('show');
            btn.classList.toggle('active');
            document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : 'auto';
        }

        // ページトップ制御
        const pagetop = document.getElementById('pagetop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) pagetop.classList.add('show');
            else pagetop.classList.remove('show');
        });

        function scrollToTop(e) {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        initLoad();
    </script>
</body>
</html>
