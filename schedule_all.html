<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL SCHEDULE - Goalink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Oswald:wght@300;500&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --main-cyan: #4bb8e0; --sumi-black: #0c0c0c; }
        body { background-color: var(--sumi-black); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        .match-card { background: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%); border-left: 2px solid var(--main-cyan); padding: 1.2rem 1.5rem; margin-bottom: 1.2rem; }
        .tag { font-family: 'Oswald', sans-serif; font-size: 0.6rem; padding: 2px 8px; background: rgba(75, 184, 224, 0.1); color: var(--main-cyan); border: 1px solid rgba(75, 184, 224, 0.3); letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
        .site-logo { height: 3.5rem; width: auto; object-fit: contain; }
        
        /* 月別ボタンUI：最上部配置用 */
        .month-container { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 8px; padding: 10px 0; -webkit-overflow-scrolling: touch; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .month-btn { flex: 0 0 auto; font-family: 'Oswald', sans-serif; font-size: 0.75rem; padding: 0.6rem 1.5rem; border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.4); cursor: pointer; transition: 0.2s; }
        .month-btn.active { background: var(--main-cyan); color: #000; border-color: var(--main-cyan); font-weight: 500; }

        .area-tab { flex: 1; text-align: center; padding: 1rem 0.5rem; font-family: 'Oswald', sans-serif; font-size: 0.65rem; letter-spacing: 0.05em; border-bottom: 1px solid rgba(255,255,255,0.1); transition: 0.3s; color: rgba(255,255,255,0.3); cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .area-tab.active { color: var(--main-cyan); border-bottom: 2px solid var(--main-cyan); background: rgba(75, 184, 224, 0.05); }

        .team-container { display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.1; }
        .color-line { height: 4px; width: 60px; margin-top: 6px; display: block; border-radius: 2px; }
        @media (min-width: 768px) { .color-line { width: 180px; } }
    </style>
</head>
<body>
    <header class="h-28 px-8 flex justify-between items-center fixed top-0 w-full z-[200] bg-black/95">
        <a href="index.html"><img src="goalinklogo.png" alt="Goalink" class="site-logo"></a>
    </header>

    <main class="pt-40 px-6 max-w-screen-md mx-auto min-h-screen">
        <div id="month-filters" class="month-container mb-6"></div>

        <div class="mb-8 text-center md:text-left">
            <span class="font-oswald text-[0.65rem] tracking-[0.5em] text-[#4bb8e0] block mb-2 uppercase">Full League Schedule</span>
            <span class="font-serif text-3xl font-black italic">ALL SCHEDULE</span>
        </div>

        <div class="flex mb-10 border-t border-white/5">
            <div class="area-tab active" onclick="updateFilters('category', 'ALL', this)">ALL</div>
            <div class="area-tab" onclick="updateFilters('category', 'J1', this)">J1</div>
            <div class="area-tab" onclick="updateFilters('category', 'J2_J3_E', this)">J2.J3 EAST</div>
            <div class="area-tab" onclick="updateFilters('category', 'J2_J3_W', this)">J2.J3 WEST</div>
        </div>

        <div id="schedule-list" class="pb-24">
            <div class="text-center py-20 text-zinc-600 font-oswald text-[0.6rem] tracking-[0.3em]">LOADING DATABASE...</div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytul6B0qqse-KLLsXZgMVml9FCjBvo0V42-FQ6p9C1U7ReCvt1BwVWnkoQOPdYRBq8/exec";
        let allMatches = [];
        let filterState = { category: 'ALL', month: 'ALL' };

        // ご提示いただいた正確なカラーコードリスト
        const TEAM_DATA = {
            1: { color: "#FF3131" }, 2: { color: "#3182FF" }, 3: { color: "#FF0000" }, 4: { color: "#FFEE00" },
            5: { color: "#FFF200" }, 6: { color: "#2E59FF" }, 7: { color: "#00B379" }, 8: { color: "#24409E" },
            9: { color: "#00B2E5" }, 10: { color: "#0055FF" }, 11: { color: "#FF9900" }, 12: { color: "#FF2200" },
            13: { color: "#CF73FF" }, 14: { color: "#3D5AFF" }, 15: { color: "#FF77BB" }, 16: { color: "#A02040" },
            17: { color: "#C7243A" }, 18: { color: "#B37DFF" }, 19: { color: "#122A5B" }, 20: { color: "#0000FF" }, // 20長崎:青に変更
            21: { color: "#00A968" }, 22: { color: "#FFD700" }, 23: { color: "#3498DB" }, 24: { color: "#2E59FF" },
            25: { color: "#FFFF00" }, 26: { color: "#24409E" }, 27: { color: "#1B2E53" }, 28: { color: "#56A9E3" },
            29: { color: "#77FF00" }, 30: { color: "#008040" }, 31: { color: "#FF0000" }, 32: { color: "#FF2200" },
            33: { color: "#FF4422" }, 34: { color: "#FF7700" }, 35: { color: "#3344BB" }, 36: { color: "#007733" },
            37: { color: "#FF8800" }, 38: { color: "#99CCFF" }, 39: { color: "#CC99FF" }, 40: { color: "#008855" },
            41: { color: "#FF6600" }, 42: { color: "#2E59FF" }, 43: { color: "#FF0000" }, 44: { color: "#33BBFF" },
            45: { color: "#2244AA" }, 46: { color: "#99DDFF" }, 47: { color: "#0055AA" }, 48: { color: "#FF8800" },
            49: { color: "#223366" }, 50: { color: "#FF2200" }, 51: { color: "#33CCFF" }, 52: { color: "#AAFF22" },
            53: { color: "#FF6600" }, 54: { color: "#FFFF00" }, 55: { color: "#77CCFF" }, 56: { color: "#FF0000" },
            57: { color: "#2E59FF" }, 58: { color: "#FFFFFF" }, 59: { color: "#334466" }, 60: { color: "#A02040" }
        };

        async function initLoad() {
            try {
                const types = ['j1', 'j2j3_east', 'j2j3_west'];
                const results = await Promise.all(types.map(t => fetch(`${SCRIPT_URL}?type=${t}`).then(r => r.json())));
                allMatches = results.flatMap(r => r.matches || []);
                generateMonthButtons();
                render();
            } catch (e) {
                document.getElementById('schedule-list').innerHTML = 'LOAD ERROR';
            }
        }

        function generateMonthButtons() {
            const container = document.getElementById('month-filters');
            const months = new Set(['ALL']);
            allMatches.forEach(m => {
                const p = String(m.date).split('.');
                if (p[1]) months.add(parseInt(p[1]) + "月");
            });
            const sorted = Array.from(months).sort((a,b) => a === 'ALL' ? -1 : parseInt(a) - parseInt(b));
            container.innerHTML = sorted.map(m => `<button class="month-btn ${m === 'ALL' ? 'active' : ''}" onclick="updateFilters('month', '${m}', this)">${m}</button>`).join('');
        }

        function updateFilters(type, value, el) {
            if (type === 'category') {
                filterState.category = value;
                document.querySelectorAll('.area-tab').forEach(t => t.classList.remove('active'));
                el.classList.add('active');
            } else if (type === 'month') {
                filterState.month = value;
                document.querySelectorAll('.month-btn').forEach(b => b.classList.remove('active'));
                el.classList.add('active');
            }
            render();
        }

        function render() {
            const listDiv = document.getElementById('schedule-list');
            let filtered = allMatches.filter(m => {
                const s = String(m.source || "").trim();
                const mMonth = String(m.date).split('.')[1] ? parseInt(String(m.date).split('.')[1]) + "月" : "";
                const catPass = (filterState.category === 'ALL') || s.startsWith(filterState.category);
                const monthPass = (filterState.month === 'ALL') || (mMonth === filterState.month);
                return catPass && monthPass;
            });

            filtered.sort((a, b) => {
                const dA = new Date(String(a.date).replace(/\./g, '/'));
                const dB = new Date(String(b.date).replace(/\./g, '/'));
                if (!isNaN(dA) && !isNaN(dB)) {
                    if (dA - dB !== 0) return dA - dB;
                    return String(a.time).localeCompare(String(b.time));
                }
                return (parseInt(a.section) || 0) - (parseInt(b.section) || 0);
            });

            listDiv.innerHTML = filtered.map(match => {
                const hColor = TEAM_DATA[Number(match.homeId)]?.color || "#333";
                const aColor = TEAM_DATA[Number(match.awayId)]?.color || "#333";
                
                let displayTag = String(match.source)
                    .replace('J2_J3_EA', 'J2.J3 EAST-A').replace('J2_J3_EB', 'J2.J3 EAST-B')
                    .replace('J2_J3_WA', 'J2.J3 WEST-A').replace('J2_J3_WB', 'J2.J3 WEST-B')
                    .replace('J1_E', 'J1 EAST').replace('J1_W', 'J1 WEST');

                return `
                    <div class="match-card">
                        <div class="flex flex-wrap items-center gap-x-4 gap-y-2 mb-6 font-oswald text-[0.7rem] tracking-wider text-zinc-400">
                            <span class="font-serif text-white font-bold text-xs">第${match.section}節</span>
                            <span class="tag">${displayTag}</span>
                            <span>${match.date} ${match.time}</span>
                            <span class="text-zinc-500">${match.stadium}</span>
                        </div>
                        <div class="flex items-center justify-center">
                            <div class="flex-1 team-container font-serif text-lg md:text-xl">
                                <span class="hidden md:inline">${match.homeName}</span>
                                <span class="inline md:hidden">${match.homeShort}</span>
                                <span class="color-line" style="background:${hColor}"></span>
                            </div>
                            <div class="mx-4 text-center">
                                ${match.homeScore && match.homeScore !== "-" ? `<span class="font-oswald text-2xl font-medium">${match.homeScore}-${match.awayScore}</span>` : `<span class="font-oswald font-bold text-[#4bb8e0] text-xs">VS</span>`}
                            </div>
                            <div class="flex-1 team-container font-serif text-lg md:text-xl">
                                <span class="hidden md:inline">${match.awayName}</span>
                                <span class="inline md:hidden">${match.awayShort}</span>
                                <span class="color-line" style="background:${aColor}"></span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }
        initLoad();
    </script>
</body>
</html>
