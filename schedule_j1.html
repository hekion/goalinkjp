<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J1 SCHEDULE - Goalink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Oswald:wght@300;500&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --main-cyan: #4bb8e0; --sumi-black: #0c0c0c; }
        body { background-color: var(--sumi-black); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        
        /* 試合カード新デザイン */
        .match-card { 
            background: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            border-left: 2px solid var(--main-cyan);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .tag {
            font-family: 'Oswald', sans-serif;
            font-size: 0.6rem;
            padding: 2px 8px;
            background: rgba(75, 184, 224, 0.1);
            color: var(--main-cyan);
            border: 1px solid rgba(75, 184, 224, 0.3);
            letter-spacing: 0.1em;
        }
        .vs-badge {
            font-family: 'Oswald', sans-serif;
            font-size: 0.7rem;
            color: var(--main-cyan);
            margin: 0 1.5rem;
            opacity: 0.8;
        }
        
        /* 既存パーツ */
        .site-logo { height: 3.5rem; }
        .area-tab.active { color: var(--main-cyan); border-bottom: 2px solid var(--main-cyan); }
        select { background-color: #111; border: 1px solid #333; appearance: none; padding: 1rem; width: 100%; color: white; }
    </style>
</head>
<body>

    <header class="h-28 px-8 flex justify-between items-center fixed top-0 w-full z-[200] bg-black/90">
        <a href="index.html"><img src="goalinklogo.png" alt="Goalink" class="site-logo"></a>
    </header>

    <main class="pt-40 px-6 max-w-screen-md mx-auto min-h-screen">
        <div class="mb-10">
            <span class="font-oswald text-[0.65rem] tracking-[0.5em] text-[#4bb8e0] block mb-2 uppercase">J1 League Schedule</span>
            <span class="font-serif text-3xl font-black">J1 試合日程</span>
        </div>

        <div class="flex mb-6 border-b border-white/10">
            <div class="area-tab flex-1 text-center py-4 cursor-pointer font-oswald text-xs tracking-widest active" onclick="updateFilters('area', 'ALL', this)">ALL</div>
            <div class="area-tab flex-1 text-center py-4 cursor-pointer font-oswald text-xs tracking-widest" onclick="updateFilters('area', 'EAST', this)">EAST</div>
            <div class="area-tab flex-1 text-center py-4 cursor-pointer font-oswald text-xs tracking-widest" onclick="updateFilters('area', 'WEST', this)">WEST</div>
        </div>

        <div id="schedule-list" class="pb-24">
            <div class="text-center py-20 text-zinc-600 font-oswald text-xs tracking-widest">LOADING...</div>
        </div>
    </main>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytul6B0qqse-KLLsXZgMVml9FCjBvo0V42-FQ6p9C1U7ReCvt1BwVWnkoQOPdYRBq8/exec";
        let allMatches = [];
        let filterState = { area: 'ALL' };

        // シート名を表示用タグに変換する辞書
        const TAG_MAP = {
            "J1_EAST": "J1 EAST",
            "J1_WEST": "J1 WEST",
            "J2_J3_EA": "J2.J3 EAST-A",
            "J2_J3_EB": "J2.J3 EAST-B",
            "J2_J3_WA": "J2.J3 WEST-A",
            "J2_J3_WB": "J2.J3 WEST-B"
        };

        async function initLoad() {
            try {
                const res = await fetch(`${SCRIPT_URL}?type=j1`);
                const data = await res.json();
                allMatches = data.matches;
                render();
            } catch (e) {
                document.getElementById('schedule-list').innerHTML = "ERROR";
            }
        }

        function updateFilters(type, value, el) {
            filterState.area = value;
            document.querySelectorAll('.area-tab').forEach(t => t.classList.remove('active', 'text-[#4bb8e0]'));
            el.classList.add('active', 'text-[#4bb8e0]');
            render();
        }

        function render() {
            const listDiv = document.getElementById('schedule-list');
            
            // 地区フィルタ（ソース名にEAST/WESTが含まれるかで判定）
            let filtered = allMatches.filter(m => {
                if (filterState.area === 'ALL') return true;
                return m.source.includes(filterState.area);
            });

            listDiv.innerHTML = filtered.map(match => {
                const displayTag = TAG_MAP[match.source] || match.source;
                const isPlayed = match.homeScore && match.homeScore !== "-";

                return `
                    <div class="match-card">
                        <div class="flex items-center gap-3 mb-3">
                            <span class="font-serif text-sm font-bold tracking-tighter">第${match.section}節</span>
                            <span class="tag">${displayTag}</span>
                        </div>

                        <div class="font-oswald text-[0.7rem] text-zinc-400 tracking-wider mb-6 flex gap-4 border-b border-white/5 pb-2">
                            <span>${match.date.replace(/\//g, '.')}</span>
                            <span>${match.time}</span>
                            <span class="text-zinc-500">${match.stadium}</span>
                        </div>

                        <div class="flex items-center justify-center py-2">
                            <div class="flex-1 text-right font-serif text-lg md:text-xl">
                                <span class="hidden md:inline">${match.homeName}</span>
                                <span class="inline md:hidden">${match.homeShort}</span>
                            </div>
                            
                            <div class="flex flex-col items-center mx-4 min-w-[60px]">
                                ${isPlayed 
                                    ? `<span class="font-oswald text-2xl font-medium tracking-tighter">${match.homeScore}-${match.awayScore}</span>` 
                                    : `<span class="vs-badge font-bold">VS</span>`}
                            </div>

                            <div class="flex-1 text-left font-serif text-lg md:text-xl">
                                <span class="hidden md:inline">${match.awayName}</span>
                                <span class="inline md:hidden">${match.awayShort}</span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        initLoad();
    </script>
</body>
</html>
