<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J1 SCHEDULE - Goalink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Oswald:wght@300;500&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --main-cyan: #4bb8e0; --sumi-black: #0c0c0c; }
        body { background-color: var(--sumi-black); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        
        /* 試合カード新デザイン */
        .match-card { 
            background: linear-gradient(145deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
            border-left: 2px solid var(--main-cyan);
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.2rem;
        }
        .tag {
            font-family: 'Oswald', sans-serif;
            font-size: 0.6rem;
            padding: 2px 8px;
            background: rgba(75, 184, 224, 0.1);
            color: var(--main-cyan);
            border: 1px solid rgba(75, 184, 224, 0.3);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }
        
        /* 既存共通パーツ */
        .site-logo { height: 3.5rem; width: auto; object-fit: contain; }
        .area-tab { flex: 1; text-align: center; padding: 1.2rem; font-family: 'Oswald', sans-serif; font-size: 0.75rem; letter-spacing: 0.2em; border-bottom: 1px solid rgba(255,255,255,0.1); transition: 0.3s; color: rgba(255,255,255,0.3); cursor: pointer; }
        .area-tab.active { color: var(--main-cyan); border-bottom: 2px solid var(--main-cyan); background: rgba(75, 184, 224, 0.05); }
    </style>
</head>
<body>

    <header class="h-28 px-8 flex justify-between items-center fixed top-0 w-full z-[200] bg-black/95">
        <a href="index.html"><img src="goalinklogo.png" alt="Goalink" class="site-logo"></a>
    </header>

    <main class="pt-40 px-6 max-w-screen-md mx-auto min-h-screen">
        <div class="mb-10">
            <span class="font-oswald text-[0.65rem] tracking-[0.5em] text-[#4bb8e0] block mb-2 uppercase">J1 League Schedule</span>
            <span class="font-serif text-3xl font-black">J1 試合日程</span>
        </div>

        <div class="flex mb-8 border-t border-white/5">
            <div class="area-tab active" onclick="updateFilters('area', 'ALL', this)">ALL</div>
            <div class="area-tab" onclick="updateFilters('area', 'EAST', this)">EAST</div>
            <div class="area-tab" onclick="updateFilters('area', 'WEST', this)">WEST</div>
        </div>

        <div id="schedule-list" class="pb-24">
            <div class="text-center py-20 text-zinc-600 font-oswald text-[0.6rem] tracking-[0.3em]">LOADING...</div>
        </div>
    </main>

    <script>
        // ★新しいデプロイURLに差し替えてください
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbytul6B0qqse-KLLsXZgMVml9FCjBvo0V42-FQ6p9C1U7ReCvt1BwVWnkoQOPdYRBq8/exec";
        let allMatches = [];
        let filterState = { area: 'ALL' };

        // タグの表示名称変換
        const TAG_MAP = {
            "J1_EAST": "J1 EAST",
            "J1_WEST": "J1 WEST",
            "J2_J3_EA": "J2.J3 EAST-A",
            "J2_J3_EB": "J2.J3 EAST-B",
            "J2_J3_WA": "J2.J3 WEST-A",
            "J2_J3_WB": "J2.J3 WEST-B"
        };

        async function initLoad() {
            try {
                const res = await fetch(`${SCRIPT_URL}?type=j1`);
                const data = await res.json();
                allMatches = data.matches;
                render();
            } catch (e) {
                document.getElementById('schedule-list').innerHTML = '<div class="text-center text-red-900 font-oswald text-xs">FAILED TO LOAD</div>';
            }
        }

        function updateFilters(type, value, el) {
            filterState.area = value;
            document.querySelectorAll('.area-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function render() {
            const listDiv = document.getElementById('schedule-list');
            
            let filtered = allMatches.filter(m => {
                if (filterState.area === 'ALL') return true;
                return m.source.includes(filterState.area);
            });

            listDiv.innerHTML = filtered.length === 0 
                ? '<div class="text-center py-20 text-zinc-600 font-oswald text-xs">NO MATCHES</div>'
                : filtered.map(match => {
                    const displayTag = TAG_MAP[match.source] || match.source;
                    const isPlayed = match.homeScore && match.homeScore !== "-" && match.homeScore !== "";
                    
                    // 日付フォーマットの整形 (yyyy/MM/dd -> MM/dd)
                    const dateValue = match.date;
                    const dateParts = dateValue.split(/[\/\-]/);
                    const formattedDate = dateParts.length >= 3 ? `${dateParts[1]}/${dateParts[2]}` : dateValue;

                    return `
                        <div class="match-card">
                            <div class="flex items-center gap-3 mb-2">
                                <span class="font-serif text-xs font-bold">第${match.section}節</span>
                                <span class="tag">${displayTag}</span>
                            </div>

                            <div class="font-oswald text-[0.75rem] text-zinc-400 mb-5 tracking-wider">
                                <span>${formattedDate}</span>
                                <span class="ml-2">${match.time}</span>
                                <span class="ml-2 text-zinc-500">${match.stadium}</span>
                            </div>

                            <div class="flex items-center justify-center">
                                <div class="flex-1 text-right font-serif text-lg md:text-xl">
                                    <span class="hidden md:inline">${match.homeName}</span>
                                    <span class="inline md:hidden">${match.homeShort}</span>
                                </div>
                                
                                <div class="flex flex-col items-center mx-6 min-w-[70px]">
                                    ${isPlayed 
                                        ? `<span class="font-oswald text-2xl font-medium tracking-tighter">${match.homeScore}-${match.awayScore}</span>` 
                                        : `<span class="font-oswald font-bold text-[#4bb8e0] text-xs tracking-widest">VS</span>`}
                                </div>

                                <div class="flex-1 text-left font-serif text-lg md:text-xl">
                                    <span class="hidden md:inline">${match.awayName}</span>
                                    <span class="inline md:hidden">${match.awayShort}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
        }

        initLoad();
    </script>
</body>
</html>
