<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEAM DETAILS | Goalink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Oswald:wght@300;500&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --main-cyan: #4bb8e0; --sumi-black: #0c0c0c; }
        body { background-color: var(--sumi-black); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; overflow-x: hidden; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }

        .menu-trigger { width: 28px; height: 14px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-end; cursor: pointer; z-index: 200; position: relative; }
        .menu-trigger span { display: block; height: 1px; background-color: #fff; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1); }
        .menu-trigger span:nth-child(1) { width: 100%; }
        .menu-trigger span:nth-child(2) { width: 60%; }
        .active span:nth-child(1) { transform: translateY(6.5px) rotate(45deg); width: 100%; }
        .active span:nth-child(2) { transform: translateY(-6.5px) rotate(-45deg); width: 100%; }

        #sideMenu {
            position: fixed; top: 0; right: -100%; width: 75%; height: 100%;
            background: rgba(10, 10, 10, 0.98); backdrop-filter: blur(20px);
            z-index: 150; transition: right 0.7s cubic-bezier(0.19, 1, 0.22, 1);
            display: flex; flex-direction: column; justify-content: center; padding-left: 12%;
            border-left: 1px solid rgba(255,255,255,0.1);
        }
        #sideMenu.open { right: 0; }
        #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); opacity: 0; visibility: hidden; z-index: 100; transition: 0.6s; }
        #overlay.show { opacity: 1; visibility: visible; }
        .menu-item { opacity: 0; transform: translateX(20px); transition: 0.5s; margin-bottom: 2rem; }
        #sideMenu.open .menu-item { opacity: 1; transform: translateX(0); }

        #pagetop {
            position: fixed; right: 24px; bottom: 24px; width: 56px; height: 56px;
            background: rgba(0, 0, 0, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 90; opacity: 0; visibility: hidden; transition: 0.4s; transform: translateY(10px);
            text-decoration: none;
        }
        #pagetop.show { opacity: 1; visibility: visible; transform: translateY(0); }
        #pagetop svg { width: 14px; height: 14px; fill: var(--main-cyan); margin-bottom: 2px; }
        #pagetop span { font-family: 'Oswald', sans-serif; font-size: 0.55rem; color: var(--main-cyan); letter-spacing: 0.1em; font-weight: 500; }

        .name-container { position: relative; display: inline-block; }
        .name-accent { position: absolute; bottom: -2px; left: 0; height: 2px; width: 0; transition: width 0.4s ease; }
        .player-row:hover .name-accent { width: 100%; }

        .player-row { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); transition: 0.4s; text-decoration: none; }
        .player-row:active { background: rgba(255,255,255,0.1) !important; transform: scale(0.98); }

        .loader { width: 20px; height: 20px; border: 2px solid var(--main-cyan); border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .error-message { font-family: 'Noto Sans JP', sans-serif; font-size: 0.8rem; color: #ff6b6b; border: 1px solid #ff6b6b; padding: 1rem; border-radius: 2px; background: rgba(255, 107, 107, 0.05); }
    </style>
</head>
<body>

    <div id="overlay" onclick="toggleMenu()"></div>
    <a href="#" id="pagetop" onclick="scrollToTop(event)">
        <svg viewBox="0 0 24 24"><path d="M12 4l-8 8h5v8h6v-8h5z"/></svg>
        <span>TOP</span>
    </a>

    <header class="h-28 px-8 flex justify-between items-center fixed top-0 w-full z-[200] bg-gradient-to-b from-black/95 to-transparent">
        <a href="index.html"><img src="goalinklogo.png" alt="Goalink" class="h-14"></a>
        <div id="menuBtn" onclick="toggleMenu()" class="menu-trigger"><span></span><span></span></div>
    </header>

    <nav id="sideMenu">
        <div class="menu-item" style="transition-delay: 0.1s;"><a href="#"><span class="font-serif text-2xl opacity-50 text-white">試合日程</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">SCHEDULE</small></a></div>
        <div class="menu-item" style="transition-delay: 0.2s;"><a href="teams.html"><span class="font-serif text-2xl text-white">チーム一覧</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">TEAMS</small></a></div>
        <div class="menu-item" style="transition-delay: 0.3s;"><a href="standing.html"><span class="font-serif text-2xl text-white">順位表</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">STANDING</small></a></div>
        <div class="menu-item" style="transition-delay: 0.4s;"><a href="database.html"><span class="font-serif text-2xl text-white">個人成績</span><small class="font-oswald text-[#4bb8e0] ml-3 text-[0.6rem] tracking-[0.3em]">PLAYERS</small></a></div>
    </nav>

    <main class="pt-48 pb-20 px-4 max-w-screen-xl mx-auto">
        <div class="mb-16 text-center">
            <a href="teams.html" class="font-serif text-[0.7rem] tracking-[0.1em] text-white/40 hover:text-white mb-6 inline-block transition-colors">← チーム一覧に戻る</a>
            <h1 id="teamName" class="text-white text-4xl md:text-6xl font-serif font-black tracking-tighter uppercase italic leading-none mb-6 whitespace-nowrap">
                <span id="headerLoader" class="loader"></span>
            </h1>
            <div id="teamUnderline" class="h-[1px] w-20 mx-auto mb-16 opacity-80" style="background-color: white;"></div>
            
            <div class="max-w-3xl mx-auto border-y border-white/10 py-8 mb-16">
                <div class="grid grid-cols-7 gap-0 text-center font-oswald text-white/80 text-sm">
                    <div class="border-r border-white/10 flex flex-col items-center"><span class="block text-[0.55rem] opacity-30 mb-1 font-serif">勝</span><span id="stat-w">-</span></div>
                    <div class="border-r border-white/10 flex flex-col items-center"><span class="block text-[0.55rem] opacity-30 mb-1 font-serif">分</span><span id="stat-d">-</span></div>
                    <div class="border-r border-white/10 flex flex-col items-center"><span class="block text-[0.55rem] opacity-30 mb-1 font-serif">敗</span><span id="stat-l">-</span></div>
                    <div class="border-r border-white/10 flex flex-col items-center"><span class="block text-[0.55rem] opacity-30 mb-1 font-serif">得点</span><span id="stat-gf">-</span></div>
                    <div class="border-r border-white/10 flex flex-col items-center"><span class="block text-[0.55rem] opacity-30 mb-1 font-serif">失点</span><span id="stat-ga">-</span></div>
                    <div class="border-r border-white/10 flex flex-col items-center"><span class="block text-[0.55rem] opacity-30 mb-1 font-serif">警告</span><span id="stat-yel">-</span></div>
                    <div class="flex flex-col items-center"><span class="block text-[0.55rem] opacity-30 mb-1 font-serif">退場</span><span id="stat-red">-</span></div>
                </div>
            </div>
        </div>

        <div id="errorMessage" class="hidden max-w-md mx-auto mb-10 text-center error-message">
            データの読み込みに失敗しました。
        </div>
        <div id="playerGrid" class="flex flex-col gap-2"></div>
    </main>

    <footer class="p-20 text-center border-t border-white/5 mx-8">
        <p class="font-oswald text-[0.55rem] tracking-[0.8em] opacity-30 uppercase">© 2026 Goalink / Powered by HEKION</p>
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcIbOA514BcUjssR78RqoWbp4bYM_eo6b3CtNPJt-9FxDrfY_5EFy9HSnTOtjG9Ytb/exec"; 

        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');
            const btn = document.getElementById('menuBtn');
            menu.classList.toggle('open');
            overlay.classList.toggle('show');
            btn.classList.toggle('active');
            document.body.style.overflow = menu.classList.contains('open') ? 'hidden' : 'auto';
        }

        const pagetop = document.getElementById('pagetop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) pagetop.classList.add('show');
            else pagetop.classList.remove('show');
        });

        function scrollToTop(e) { e.preventDefault(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        async function loadPlayerData() {
            const urlParams = new URLSearchParams(window.location.search);
            const teamId = urlParams.get('id');
            if (!teamId) return;

            try {
                const response = await fetch(`${SCRIPT_URL}?id=${teamId}`);
                const data = await response.json();
                
                document.getElementById('teamName').textContent = data.teamName;
                const teamColor = data.teamColor || '#FFFFFF';
                document.getElementById('teamUnderline').style.backgroundColor = teamColor;

                if (data.stats) {
                    document.getElementById('stat-w').textContent = data.stats.win || '0';
                    document.getElementById('stat-d').textContent = data.stats.draw || '0';
                    document.getElementById('stat-l').textContent = data.stats.loss || '0';
                    document.getElementById('stat-gf').textContent = data.stats.gf || '0';
                    document.getElementById('stat-ga').textContent = data.stats.ga || '0';
                    document.getElementById('stat-yel').textContent = data.stats.yel || '0';
                    document.getElementById('stat-red').textContent = data.stats.red || '0';
                }

                document.getElementById('playerGrid').innerHTML = data.players.map(p => {
                    const detailUrl = `playerpage.html?id=${p.id}&tid=${teamId}`;
                    const birthDisplay = p.birthday ? p.birthday.substring(0, 10) : '----.--.--';
                    
                    return `
                    <a href="${detailUrl}" class="player-row flex flex-col md:flex-row items-center p-5 rounded-sm">
                        <div class="flex items-center w-full md:flex-1">
                            <span class="font-oswald text-[0.7rem] w-12 text-gray-400 font-medium uppercase tracking-wider">${p.position}</span>
                            <span class="font-oswald text-2xl w-12 text-white">#${p.number}</span>
                            <div class="name-container ml-4">
                                <span class="font-serif font-black text-xl text-white tracking-widest leading-none">${p.name}</span>
                                <div class="name-accent" style="background-color: ${teamColor}"></div>
                            </div>
                        </div>
                        
                        <div class="flex flex-1 w-full justify-between md:justify-around text-[0.7rem] font-oswald text-white/40 my-4 md:my-0 px-4 tracking-widest uppercase italic">
                            <span>${birthDisplay}</span>
                            <span>${p.height || '---'}CM</span>
                            <span>${p.weight || '--'}KG</span>
                        </div>

                        <div class="w-full md:w-1/3 grid grid-cols-5 gap-1 text-center font-oswald text-white">
                            <div class="flex flex-col"><span class="text-[0.5rem] opacity-20 mb-1 font-serif">出場</span><span class="text-sm">${p.games || 0}</span></div>
                            <div class="flex flex-col"><span class="text-[0.5rem] opacity-20 mb-1 font-serif">時間</span><span class="text-sm">${p.minutes || 0}</span></div>
                            <div class="flex flex-col"><span class="text-[0.5rem] opacity-20 mb-1 font-serif">得点</span><span class="text-sm">${p.goals || 0}</span></div>
                            <div class="flex flex-col"><span class="text-[0.5rem] opacity-20 mb-1 font-serif">警告</span><span class="text-sm">${p.yellow || 0}</span></div>
                            <div class="flex flex-col"><span class="text-[0.5rem] opacity-20 mb-1 font-serif">退場</span><span class="text-sm">${p.red || 0}</span></div>
                        </div>
                    </a>`;
                }).join('');
            } catch (e) {
                document.getElementById('headerLoader').classList.add('hidden');
                document.getElementById('teamName').textContent = "ERROR";
                document.getElementById('errorMessage').classList.remove('hidden');
            }
        }
        loadPlayerData();
    </script>
</body>
</html>
