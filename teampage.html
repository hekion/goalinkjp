<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEAM DETAILS | Goalink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Oswald:wght@300;500&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --main-cyan: #4bb8e0; --sumi-black: #0c0c0c; }
        body { background-color: var(--sumi-black); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }

        /* ヘッダー */
        .site-logo { height: 3.5rem; width: auto; object-fit: contain; }
        
        /* 選手行（1行1人） */
        .player-row {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-decoration: none;
        }

        /* 選手名下の装飾ライン */
        .name-accent {
            height: 2px;
            width: 15px;
            margin-top: 4px;
            transition: width 0.3s ease;
        }
        .player-row:hover .name-accent { width: 35px; }

        /* フェードイン */
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ローディング */
        .loader { width: 20px; height: 20px; border: 2px solid var(--main-cyan); border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="overflow-x-hidden">

    <header class="h-28 px-8 flex justify-between items-center fixed top-0 w-full z-[200] bg-black/90 backdrop-blur-md">
        <a href="index.html"><img src="goalinklogo.png" alt="Goalink" class="site-logo"></a>
        
        <button onclick="toggleMenu()" class="group flex flex-col items-end gap-1.5 focus:outline-none">
            <span class="w-8 h-[1px] bg-white group-hover:w-10 transition-all"></span>
            <span class="w-5 h-[1px] bg-white group-hover:w-10 transition-all"></span>
            <p class="font-oswald text-[0.5rem] tracking-[0.3em] mt-1 opacity-60">MENU</p>
        </button>
    </header>

    <div id="sideMenu" class="fixed inset-0 bg-black/98 z-[300] flex flex-col justify-center items-center gap-8 translate-x-full transition-transform duration-500 font-serif">
        <button onclick="toggleMenu()" class="absolute top-10 right-10 text-white font-oswald text-xs tracking-widest uppercase">Close ×</button>
        <a href="index.html" class="text-4xl hover:italic transition-all">HOME</a>
        <a href="teams.html" class="text-4xl hover:italic transition-all">TEAMS</a>
        <a href="#" class="text-4xl hover:italic transition-all opacity-20">NEWS</a>
        <a href="#" class="text-4xl hover:italic transition-all opacity-20">ABOUT</a>
    </div>

    <main class="pt-48 pb-20 px-4 max-w-screen-xl mx-auto">
        <div class="mb-16 text-center fade-in">
            <a href="teams.html" class="font-oswald text-[0.6rem] tracking-[0.4em] text-white/30 hover:text-white mb-6 inline-block uppercase italic">← Back to Teams</a>
            
            <h1 id="teamName" class="text-white text-5xl md:text-7xl font-serif font-black tracking-tighter uppercase italic leading-none mb-6">
                <span class="loader"></span>
            </h1>
            <div id="teamUnderline" class="h-[1px] w-20 mx-auto mb-16 opacity-80" style="background-color: white;"></div>

            <div class="max-w-3xl mx-auto border-y border-white/10 py-8 mb-16">
                <p class="font-oswald text-[0.55rem] tracking-[0.4em] opacity-30 mb-6 italic">SEASON TOTALS</p>
                <div class="grid grid-cols-7 gap-0 text-center font-oswald">
                    <div class="border-r border-white/10 text-white"><span class="block text-[0.55rem] opacity-30 mb-1">W</span><span class="text-xl">-</span></div>
                    <div class="border-r border-white/10 text-white"><span class="block text-[0.55rem] opacity-30 mb-1">D</span><span class="text-xl">-</span></div>
                    <div class="border-r border-white/10 text-white"><span class="block text-[0.55rem] opacity-30 mb-1">L</span><span class="text-xl">-</span></div>
                    <div class="border-r border-white/10 text-white"><span class="block text-[0.55rem] opacity-30 mb-1">GF</span><span class="text-xl">-</span></div>
                    <div class="border-r border-white/10 text-white"><span class="block text-[0.55rem] opacity-30 mb-1">GA</span><span class="text-xl">-</span></div>
                    <div class="border-r border-white/10 text-white"><span class="block text-[0.55rem] opacity-30 mb-1">YEL</span><span class="text-xl">-</span></div>
                    <div class="text-white"><span class="block text-[0.55rem] opacity-30 mb-1">RED</span><span class="text-xl">-</span></div>
                </div>
            </div>
        </div>

        <div class="mb-6 flex items-center px-6 text-[0.55rem] opacity-20 tracking-[0.4em] font-oswald uppercase">
            <div class="flex-1">Player Profile</div>
            <div class="hidden md:flex flex-1 justify-around">Physical</div>
            <div class="w-full md:w-1/3 grid grid-cols-5 text-center">Stats</div>
        </div>

        <div id="playerGrid" class="flex flex-col gap-2"></div>
    </main>

    <footer class="p-20 text-center border-t border-white/5 mx-8">
        <p class="font-oswald text-[0.55rem] tracking-[0.8em] opacity-30 uppercase">© 2026 Goalink / Powered by HEKION</p>
    </footer>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcIbOA514BcUjssR78RqoWbp4bYM_eo6b3CtNPJt-9FxDrfY_5EFy9HSnTOtjG9Ytb/exec"; 

        function toggleMenu() {
            document.getElementById('sideMenu').classList.toggle('translate-x-full');
        }

        async function loadPlayerData() {
            const urlParams = new URLSearchParams(window.location.search);
            const teamId = urlParams.get('id');
            const playerGrid = document.getElementById('playerGrid');
            const teamNameElement = document.getElementById('teamName');
            const teamUnderline = document.getElementById('teamUnderline');

            if (!teamId) return;

            try {
                const response = await fetch(`${SCRIPT_URL}?id=${teamId}`);
                const data = await response.json();
                if (data.error) throw new Error(data.error);

                teamNameElement.textContent = data.teamName;
                const teamColor = data.teamColor || '#FFFFFF';
                teamUnderline.style.backgroundColor = teamColor;

                // 選手リスト生成：1行1人の構造・文字は白・アクセントにチームカラー
                playerGrid.innerHTML = data.players.map((p, index) => `
                    <a href="player-detail.html?name=${encodeURIComponent(p.name)}" 
                       class="player-row flex flex-col md:flex-row items-center p-5 rounded-sm fade-in"
                       style="animation-delay: ${index * 0.03}s"
                       onmouseover="this.style.borderColor='${teamColor}'; this.style.background='rgba(255,255,255,0.06)';" 
                       onmouseout="this.style.borderColor='rgba(255,255,255,0.05)'; this.style.background='rgba(255,255,255,0.03)';"
                    >
                        <div class="flex items-center w-full md:flex-1 mb-4 md:mb-0">
                            <span class="font-oswald text-[0.65rem] w-10 font-bold opacity-30 text-white uppercase">${p.position}</span>
                            <span class="font-oswald text-2xl w-12 text-white">#${p.number}</span>
                            <div class="flex flex-col ml-4">
                                <span class="font-serif font-black text-xl text-white tracking-widest leading-none">${p.name}</span>
                                <div class="name-accent" style="background-color: ${teamColor}"></div>
                            </div>
                        </div>

                        <div class="flex flex-1 w-full justify-between md:justify-around text-[0.7rem] font-oswald text-white/40 mb-4 md:mb-0 px-6 border-y border-white/5 md:border-none py-2 md:py-0 tracking-widest uppercase">
                            <span>${p.birthday}</span>
                            <span>${p.height}CM</span>
                            <span>${p.weight}KG</span>
                        </div>

                        <div class="w-full md:w-1/3 grid grid-cols-5 gap-1 text-center font-oswald text-white">
                            <div class="flex flex-col"><span class="text-[0.5rem] opacity-20 mb-1">APP</span><span class="text-sm">${p.games}</span></div>
                            <div class="flex flex-col"><span class="text-[0.5rem] opacity-20 mb-1">MIN</span><span class="text-sm">${p.minutes}</span></div>
                            <div class="flex flex-col"><span class="text-[0.5rem] opacity-20 mb-1">G</span><span class="text-sm">${p.goals}</span></div>
                            <div class="flex flex-col"><span class="text-[0.5rem] opacity-20 mb-1">Y</span><span class="text-sm">${p.yellow}</span></div>
                            <div class="flex flex-col"><span class="text-[0.5rem] opacity-20 mb-1">R</span><span class="text-sm">${p.red}</span></div>
                        </div>
                    </a>
                `).join('');

            } catch (e) {
                playerGrid.innerHTML = `<div class="text-center py-20 opacity-40 font-oswald text-xs tracking-widest uppercase">Data Connection Error</div>`;
            }
        }
        loadPlayerData();
    </script>
</body>
</html>
