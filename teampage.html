        };

        async function loadData() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const config = teamMap[id];

            const displayTitle = document.getElementById('team-name-display');
            const listContainer = document.getElementById('player-list');

            if (!config) {
                displayTitle.textContent = "TEAM NOT FOUND";
                listContainer.innerHTML = '<p class="text-gray-500">IDが正しくありません。</p>';
                return;
            }

            displayTitle.textContent = config.name;

            // スプレッドシートから特定のシートをCSVとして取得するURL
            const url = `https://docs.google.com/spreadsheets/d/${config.fileId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(config.sheet)}`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network error');
                
                const csvText = await response.text();
                
                // CSV解析（簡易版：改行で分けてカンマで分ける）
                const rows = csvText.split('\n').map(row => {
                    // ダブルクォーテーションを削除して配列にする
                    return row.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1'));
                });

                listContainer.innerHTML = ''; // ローディングメッセージを消去

                rows.forEach((row, index) => {
                    if (index === 0) return; // ヘッダー行を無視
                    
                    // スプシの構成に合わせて順番を調整してください [0]:ポジション, [1]:番号, [2]:名前
                    const [pos, num, name] = row;

                    if (!name || name.trim() === "") return;

                    const html = `
                        <div class="flex items-center gap-6 border-b border-white/10 pb-3 hover:bg-white/5 transition-colors group">
                            <span class="font-oswald w-10 text-[#4bb8e0] text-sm font-light">${pos}</span>
                            <span class="font-oswald w-6 text-center text-lg font-medium">${num}</span>
                            <span class="font-serif text-lg tracking-wider group-hover:pl-2 transition-all">${name}</span>
                        </div>
                    `;
                    listContainer.insertAdjacentHTML('beforeend', html);
                });

                if (listContainer.innerHTML === '') {
                    listContainer.innerHTML = '<p class="text-gray-500">選手データがありません。</p>';
                }

            } catch (error) {
                console.error('Fetch error:', error);
                listContainer.innerHTML = '<p class="text-red-500 font-oswald text-xs uppercase">Failed to load data. Please check spreadsheet settings.</p>';
            }
        }

        // 実行
        loadData();
