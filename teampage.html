<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEAM SQUAD | Goalink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@900&family=Oswald:wght@300;500&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --main-cyan: #4bb8e0; --sumi-black: #0c0c0c; }
        body { background-color: var(--sumi-black); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }
        .site-logo { height: 3.5rem; width: auto; }
    </style>
</head>
<body class="pt-28 px-8">

    <header class="h-28 px-8 flex justify-between items-center fixed top-0 w-full z-[200] bg-black/95">
        <a href="index.html"><img src="goalinklogo.png" alt="Goalink" class="site-logo"></a>
        <a href="teams.html" class="font-oswald text-[0.7rem] tracking-widest border border-white/20 px-4 py-2 hover:bg-white hover:text-black transition-all">BACK TO LIST</a>
    </header>

    <main class="max-w-screen-md mx-auto">
        <section class="mb-12">
            <h1 id="team-name-display" class="font-serif text-4xl mt-2 italic tracking-tight text-white">LOADING...</h1>
        </section>

        <section class="mb-20">
            <div class="border-l-4 border-[#4bb8e0] pl-5 mb-8">
                <h2 class="font-serif text-2xl">選手一覧</h2>
                <p class="font-oswald text-[0.6rem] text-gray-500 tracking-tighter uppercase">Squad List</p>
            </div>

            <div id="player-list" class="space-y-4">
                <p class="text-gray-500 animate-pulse font-oswald text-sm">Fetching data from spreadsheet...</p>
            </div>
        </section>
    </main>

    <script>
        // 【住所録】ここには以前お送りした60チーム分のteamMapをそのまま入れてください
        const teamMap = {
            "8":  { name: "鹿島アントラーズ", sheet: "鹿島", fileId: "1vQEzvp0G3nZmYcyiAVe_bxuXJacYbI7h8rcCplO2U7YeIbSBUr4gcTW8Uy4Aeo_on1EggJLKb7MpRz" },
            "9":  { name: "水戸ホーリーホック", sheet: "水戸", fileId: "1vQEzvp0G3nZmYcyiAVe_bxuXJacYbI7h8rcCplO2U7YeIbSBUr4gcTW8Uy4Aeo_on1EggJLKb7MpRz" },
            "13": { name: "浦和レッズ", sheet: "浦和", fileId: "1vQEzvp0G3nZmYcyiAVe_bxuXJacYbI7h8rcCplO2U7YeIbSBUr4gcTW8Uy4Aeo_on1EggJLKb7MpRz" },
            // ... (他のチームも同様に追加)
            "1":  { name: "北海道コンサドーレ札幌", sheet: "札幌", fileId: "1R1OuugKy4qa2tbK_49nb5mShGTCcChQVHzDtbF-wrHj78O6nIxK4J2sRLK63DWvn0z8SPKyom_ayyK" },
            "28": { name: "アルビレックス新潟", sheet: "新潟", fileId: "1SNSni2W180b_oRYlaji-2qjyDPWXjkJbMSIbKvgy_aJQDHlNR6CwOLCg8sGreYR1W6ZhxJ7qFSFnT3" }
            // ※長いので中略していますが、以前の60チーム分をここに貼り付けてください
        };

        async function loadData() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');
            const config = teamMap[id];

            const displayTitle = document.getElementById('team-name-display');
            const listContainer = document.getElementById('player-list');

            if (!config) {
                displayTitle.textContent = "TEAM NOT FOUND";
                return;
            }

            displayTitle.textContent = config.name;

            const url = `https://docs.google.com/spreadsheets/d/${config.fileId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(config.sheet)}`;

            try {
                const response = await fetch(url);
                const csvText = await response.text();
                
                // CSV解析
                const allRows = csvText.split('\n').map(row => {
                    return row.split(',').map(cell => cell.replace(/^"(.*)"$/, '$1'));
                });

                // 5行目からデータ開始（インデックス4から最後まで）
                const playerRows = allRows.slice(4);

                listContainer.innerHTML = ''; 

                playerRows.forEach((row) => {
                    // C列からデータ開始なので、最初の2列(A,B)を無視して [C]:ポジション, [D]:背番号, [E]:名前 を取得
                    const [pos, num, name] = row.slice(2);

                    if (!name || name.trim() === "" || name === "氏名") return;

                    const html = `
                        <div class="flex items-center gap-6 border-b border-white/10 pb-3 hover:bg-white/5 transition-colors group">
                            <span class="font-oswald w-10 text-[#4bb8e0] text-sm font-light">${pos}</span>
                            <span class="font-oswald w-6 text-center text-lg font-medium">${num}</span>
                            <span class="font-serif text-lg tracking-wider group-hover:pl-2 transition-all">${name}</span>
                        </div>
                    `;
                    listContainer.insertAdjacentHTML('beforeend', html);
                });

            } catch (error) {
                console.error('Error:', error);
                listContainer.innerHTML = '<p class="text-red-500">読み込みに失敗しました。スプレッドシートの共有設定を確認してください。</p>';
            }
        }
        loadData();
    </script>
</body>
</html>
