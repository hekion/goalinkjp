<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEAM DETAILS | Goalink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@600;900&family=Oswald:wght@300;500&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root { --main-cyan: #4bb8e0; --sumi-black: #0c0c0c; }
        body { background-color: var(--sumi-black); color: #fff; font-family: 'Noto Sans JP', sans-serif; font-weight: 300; }
        .font-serif { font-family: 'Noto Serif JP', serif; }
        .font-oswald { font-family: 'Oswald', sans-serif; }

        /* ヘッダー */
        .site-logo { height: 3.5rem; width: auto; object-fit: contain; }
        
        /* 選手カード */
        .player-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.3s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .player-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: var(--main-cyan);
            transform: translateY(-2px);
        }

        /* アニメーション */
        .fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ローディングアニメーション */
        .loader {
            width: 20px; height: 20px;
            border: 2px solid var(--main-cyan);
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="overflow-x-hidden">

    <header class="h-28 px-8 flex justify-between items-center fixed top-0 w-full z-[200] bg-gradient-to-b from-black to-transparent">
        <a href="index.html"><img src="goalinklogo.png" alt="Goalink" class="site-logo"></a>
        <a href="teams.html" class="font-oswald text-[0.7rem] tracking-[0.2em] border border-white/20 px-4 py-2 hover:bg-white hover:text-black transition-all">BACK TO LIST</a>
    </header>

    <main class="pt-40 pb-20 px-8 max-w-screen-lg mx-auto">
        <div class="mb-16 text-center fade-in">
            <span class="font-oswald text-[#4bb8e0] tracking-[0.4em] text-xs block mb-2 uppercase">Team Roster</span>
            <h1 id="teamName" class="text-4xl md:text-5xl font-serif font-black tracking-tighter">
                <span class="opacity-20">Loading...</span>
            </h1>
            <div class="w-12 h-[1px] bg-[#4bb8e0] mx-auto mt-6"></div>
        </div>

        <div id="playerGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <div class="col-span-full text-center py-20">
                <span class="loader"></span>
                <p class="font-oswald text-[0.6rem] tracking-[0.2em] mt-4 opacity-40">FETCHING SQUAD DATA</p>
            </div>
        </div>
    </main>

    <footer class="p-20 text-center border-t border-white/5 mx-8">
        <p class="font-oswald text-[0.55rem] tracking-[0.8em] opacity-30 uppercase">© 2026 Goalink / Powered by HEKION</p>
    </footer>

    <script>
        // あなたが発行したGASのURL
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcIbOA514BcUjssR78RqoWbp4bYM_eo6b3CtNPJt-9FxDrfY_5EFy9HSnTOtjG9Ytb/exec"; 

        async function loadPlayerData() {
            const urlParams = new URLSearchParams(window.location.search);
            const teamId = urlParams.get('id');
            const playerGrid = document.getElementById('playerGrid');
            const teamNameElement = document.getElementById('teamName');

            if (!teamId) {
                playerGrid.innerHTML = '<p class="text-center opacity-50 col-span-full font-serif text-sm">チームIDが正しくありません。</p>';
                return;
            }

            try {
                // GASからデータを取得
                const response = await fetch(`${SCRIPT_URL}?id=${teamId}`);
                const data = await response.json();

                if (data.error) {
                    playerGrid.innerHTML = `
                        <div class="col-span-full text-center py-10">
                            <p class="text-red-400 font-serif text-sm mb-2">データが見つかりませんでした</p>
                            <p class="text-[0.6rem] opacity-40 uppercase tracking-widest">${data.error}</p>
                        </div>`;
                    return;
                }

                // チーム名をセット
                teamNameElement.textContent = data.teamName;
                document.title = `${data.teamName} | Goalink`;

                // 選手がいなかった場合
                if (!data.players || data.players.length === 0) {
                    playerGrid.innerHTML = '<p class="text-center opacity-50 col-span-full py-10 font-serif text-sm">現在、選手データが登録されていません。</p>';
                    return;
                }

                // 選手カードの生成（ポジション・背番号・名前）
                playerGrid.innerHTML = data.players.map((p, index) => `
                    <div class="player-card p-6 fade-in" style="animation-delay: ${index * 0.05}s">
                        <div class="flex flex-col h-full">
                            <div class="flex justify-between items-start mb-4">
                                <span class="font-oswald text-[0.6rem] text-[#4bb8e0] tracking-[0.2em] border-b border-[#4bb8e0]/30 pb-1">
                                    ${p.position || '---'}
                                </span>
                                <span class="font-oswald text-xl text-white/20">
                                    #${p.number || '--'}
                                </span>
                            </div>
                            <h2 class="text-xl font-serif font-bold tracking-widest leading-tight">
                                ${p.name || 'Unknown'}
                            </h2>
                        </div>
                    </div>
                `).join('');

            } catch (e) {
                console.error(e);
                playerGrid.innerHTML = `
                    <div class="col-span-full text-center py-10">
                        <p class="text-red-400 font-serif text-sm mb-2">システムエラーが発生しました</p>
                        <p class="text-[0.6rem] opacity-40 uppercase tracking-widest">Connection Failed</p>
                    </div>`;
            }
        }

        // 実行
        loadPlayerData();
    </script>
</body>
</html>
